<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Paint Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* The paint room: repaint the museum's sprites one at a time, a little every day. Phone first.
   Art only: it keeps its own art library (IndexedDB) and never writes the curator's draft or anything else in the pack.
   The plan and handoff live in PAINT-ROOM-PLAN.md. */
:root{
  --bg:#f1e4df;--surface:#fffaf7;--surface-2:#f6ebe6;--line:#d9c0b8;--text:#2a171c;--muted:#6d5157;
  --gold:#8f5a0a;--on-gold:#fff8ec;--warn:#a33a22;--ok:#3f7a2a;--shadow:#d9c0b8;--todo:#c0532e;--lit:#f0b840;--dark-room:#3a2a30;
  --wip:#5a7ac0;--pack:#7a5ab0;--check-a:#e8dcd6;--check-b:#f8f0ec;
  --pixel:'Press Start 2P',ui-monospace,monospace;--body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1317;--surface:#281a1f;--surface-2:#34232a;--line:#4b343b;--text:#f3e5d0;--muted:#b59e8c;
  --gold:#e8b24a;--on-gold:#2a1a10;--warn:#f08a6a;--ok:#9fcf7a;--shadow:#0e080a;--todo:#f08a6a;--lit:#f0c050;--dark-room:#120b0e;
  --wip:#8aa8f0;--pack:#b89ae8;--check-a:#2e2025;--check-b:#3a2a30;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1d1317;--surface:#281a1f;--surface-2:#34232a;--line:#4b343b;--text:#f3e5d0;--muted:#b59e8c;
  --gold:#e8b24a;--on-gold:#2a1a10;--warn:#f08a6a;--ok:#9fcf7a;--shadow:#0e080a;--todo:#f08a6a;--lit:#f0c050;--dark-room:#120b0e;
  --wip:#8aa8f0;--pack:#b89ae8;--check-a:#2e2025;--check-b:#3a2a30;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none !important}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 112px)}
.app.nobar{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}

/* Top bar */
.top{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:12px}
.top h1{font-family:var(--pixel);font-weight:400;font-size:13px;line-height:1.5;color:var(--gold);margin:0;flex:1;min-width:0}
.top .crumb{font-size:.85rem;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:2px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:700;padding:0 10px}
.iconbtn:active{transform:translateY(1px)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:48px;padding:.5em 1.1em;border:2px solid var(--text);background:var(--surface);
  border-radius:6px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;font-weight:700;font-size:1rem;text-decoration:none;color:var(--text)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.quiet{border-color:var(--line);box-shadow:none;font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.small{font-size:.85rem;color:var(--muted)}

/* Cards */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px}
.panel h2{font-family:var(--pixel);font-weight:400;font-size:11px;line-height:1.6;margin:0 0 10px;color:var(--text)}
.today{border-color:var(--gold);box-shadow:4px 4px 0 var(--shadow)}
.today .pick{display:flex;gap:14px;align-items:center;margin:0 0 14px}
.today .what{font-weight:700;font-size:1.05rem;line-height:1.35;margin:0 0 2px}
.today .where{font-size:.85rem;color:var(--muted);margin:0}
.today .acts{display:flex;gap:10px}
.today .acts .btn{flex:1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:76px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.tile b{font-size:.98rem;line-height:1.25}
.tile span{font-size:.82rem;color:var(--muted)}
.tile:active{transform:translateY(1px)}

/* A sprite on a checkerboard */
.chk{background-color:var(--check-b);background-image:linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%),linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.today .chk{flex:none;width:84px;height:84px;border:2px solid var(--line)}

/* Punch card */
.punch-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.punch-head h2{margin:0}
.punch{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.punch .dow{font-size:.7rem;color:var(--muted);text-align:center}
.punch .d{aspect-ratio:1;border:2px dashed var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);position:relative}
.punch .d.blank{border:0}
.punch .d.today{border-style:solid;border-color:var(--gold);color:var(--text);font-weight:700}
.punch .d.hit{border:0;background:var(--gold);color:var(--on-gold);font-weight:700}
.punch .d.hit::after{content:"";position:absolute;inset:3px;border:2px solid var(--on-gold);border-radius:50%;opacity:.55}
.punch .d.future{opacity:.4}
.punch-foot{margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.stamp-in{animation:stampin .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampin{0%{transform:scale(2.4) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}

/* Gallery wings: one per group, lighting up as its sprites get done */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.room{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:96px}
.room .win{height:30px;border-radius:4px;background:var(--dark-room);position:relative;overflow:hidden;border:2px solid var(--line)}
.room .win i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--lit),#ffe08a);box-shadow:0 0 14px var(--lit);transition:width .6s}
.room .win.full{box-shadow:0 0 12px var(--lit)}
.room b{font-size:.86rem;line-height:1.25}
.room span{font-size:.76rem;color:var(--muted)}
.room .badge{position:absolute;top:-8px;right:-6px;background:var(--gold);color:var(--on-gold);font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px}
.room:active{transform:translateY(1px)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--lit)}

/* Find */
.search{width:100%;min-height:48px;border:2px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;font-size:16px}
.search:focus{border-color:var(--gold);outline:none}
select.search{appearance:auto;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.count{margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
.sp{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.sp:active{transform:translateY(1px)}
.sp .chk{height:72px}
.sp b{font-size:.78rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.sp .dot{position:absolute;top:6px;right:6px}
.ghead{grid-column:1/-1;margin:10px 0 0;font-weight:700;font-size:.85rem}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);display:inline-block}
.dot.todo{background:var(--todo);border-color:var(--todo)}
.dot.wip{background:var(--wip);border-color:var(--wip)}
.dot.painted{background:var(--lit);border-color:var(--gold)}
.dot.kept{background:var(--surface);border-color:var(--gold)}
.dot.pack{background:var(--pack);border-color:var(--pack)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px}

/* One sprite */
.who{font-weight:700;font-size:1.1rem;line-height:1.35;margin:0 0 4px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tag{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;border:2px solid var(--line);color:var(--muted)}
.tag.todo{border-color:var(--todo);color:var(--todo)}
.tag.painted,.tag.kept{border-color:var(--gold);color:var(--gold)}
.tag.wip{border-color:var(--wip);color:var(--wip)}
.tag.pack{border-color:var(--pack);color:var(--pack)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.views figure{margin:0}
.views figcaption{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 4px}
.views .chk{height:150px;border:2px solid var(--line)}
.views.one{grid-template-columns:1fr}
.brief{background:var(--surface-2);border-left:4px solid var(--gold);border-radius:6px;padding:10px 12px;margin:0 0 14px;font-size:.92rem}
.brief b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem;margin:0 0 14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:700}

/* The bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:2px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px)}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}

/* After a save */
.done{position:fixed;inset:0;z-index:20;background:rgba(20,10,14,.62);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.done .sheet{width:100%;max-width:560px;background:var(--surface);border-radius:16px 16px 0 0;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;animation:rise .28s cubic-bezier(.2,1.2,.4,1) both}
.done .big{font-family:var(--pixel);font-size:18px;line-height:1.5;color:var(--gold);margin:6px 0 6px;display:inline-block}
.done p{margin:0 0 16px;color:var(--muted)}
.done .acts{display:flex;gap:10px}
.done .acts .btn{flex:1}
.seal{width:84px;height:84px;margin:0 auto 6px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:10px;line-height:1.3;position:relative}
.seal::after{content:"";position:absolute;inset:6px;border:3px solid var(--on-gold);border-radius:50%;opacity:.6}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.banner{background:var(--surface-2);border:2px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:.86rem;margin:0 0 14px}
.banner.info{border-color:var(--gold)}
.foot{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.foot .small{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:700;font-size:.85rem;z-index:30;animation:fade .2s both}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
/* The painter */
.pv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.pv .chk{border:2px solid var(--line);padding:6px;min-width:44px;min-height:44px}
.stage{position:relative;width:100%;height:min(calc(100vw - 32px),52vh,528px);height:min(calc(100vw - 32px),52svh,528px);border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);touch-action:none;user-select:none;-webkit-user-select:none}
.stage > canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.zoom{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin:8px 0 0}
.framelabel{margin:8px 0 0;line-height:1.3}
.zoom button{min-width:44px;min-height:44px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;padding:0 8px}
.zoom button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.pip{position:absolute;z-index:3;border:2px solid var(--gold);border-radius:8px;background:#000;box-shadow:0 2px 10px rgba(0,0,0,.45);overflow:hidden;cursor:pointer;touch-action:manipulation;transition:top .15s,left .15s,right .15s,bottom .15s}
.pip canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.pip.tr{top:6px;right:6px}.pip.br{bottom:6px;right:6px}.pip.bl{bottom:6px;left:6px}.pip.tl{top:6px;left:6px}
.pip .x{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:1rem;line-height:1;cursor:pointer;padding:0}
.pip .lbl{position:absolute;left:5px;bottom:2px;font-size:.62rem;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000;pointer-events:none}
.frames{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.frames button{flex:none;display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:4px;border:2px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.frames button[aria-current="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.framebar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.frames button{flex-direction:column;gap:2px}
.fcap{font-size:.6rem;line-height:1.1;color:var(--muted);max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fset{border:2px dashed var(--line);border-radius:10px;padding:8px 10px;margin:10px 0 0}
.fset summary{cursor:pointer;font-size:.85rem;font-weight:700;color:var(--muted);min-height:28px;display:list-item}
.fset[open] summary{margin-bottom:4px}
.fsrow{display:flex;align-items:center;gap:6px;margin:4px 0}
.fsrow.wrap{flex-wrap:wrap}
.fsrow > span.small:first-child{min-width:70px}
.fset .chip{min-height:34px;padding:4px 12px}
.order{display:flex;flex-wrap:wrap;gap:4px}
.ochip{min-width:26px;height:26px;border-radius:6px;background:var(--surface-2);border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.fset .range{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:8px;font-size:.85rem}
.fset input[type=range]{accent-color:var(--gold)}
.chk.setrow{gap:6px;padding:6px;flex-wrap:wrap}
.setrow canvas.on{outline:2px solid var(--gold);outline-offset:1px}
.framebar .btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.tool span{line-height:1.15;text-align:center}
.selbar{align-items:center;margin:0 0 10px}
.trace .range,.colors .range{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:10px;margin:8px 0;font-size:.85rem;font-weight:700}
.trace input[type=range],.colors input[type=range]{width:100%;accent-color:var(--gold)}
.colors input[type=range]{-webkit-appearance:none;appearance:none;height:22px;border-radius:999px;border:2px solid var(--line)}
.colors input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #222;box-shadow:0 0 0 1px #fff}
.colors input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #222}
.colors input.hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.done .sheet.colors{text-align:left}
.cmprow{display:flex;gap:10px;align-items:center;margin:8px 0}
.sw.cmp{width:72px;height:44px;cursor:default;display:flex}
.sw.cmp i{position:static;flex:1}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:10px 0}
.check input{width:22px;height:22px;accent-color:var(--gold)}
.reorder{display:flex;gap:6px}
.reorder .btn{text-transform:none;letter-spacing:0}
.sw.big{cursor:pointer}
.scchips{padding-top:8px;padding-bottom:0}
.scview{margin-top:8px;padding:6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.badge b{font-size:.76rem;line-height:1.2}
.badge span{font-size:.7rem;color:var(--muted)}
.badge-tok{width:var(--b);height:var(--b);border-radius:50%;overflow:hidden;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;opacity:.55;filter:grayscale(1);background:var(--surface-2)}
.badge-tok.got{border:3px solid var(--gold);opacity:1;filter:none;background:radial-gradient(circle,var(--surface) 55%,var(--lit) 56%,var(--lit) 70%,var(--surface) 71%);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
.badge-tok .glyph{font-family:var(--pixel);font-size:12px;color:var(--gold)}
.newbadges{display:flex;justify-content:center;gap:16px;margin:0 0 14px;flex-wrap:wrap}
.plan{margin:10px 0}
.pgroup{border-left:4px solid var(--line);padding:4px 10px;margin:8px 0}
.pgroup.ok{border-color:var(--ok)}
.pgroup.clash{border-color:var(--warn)}
.pgroup.muted{opacity:.85}
.pgroup b{font-size:.85rem}
.pgroup ul{margin:4px 0 0;padding-left:18px;font-size:.88rem}
.pgroup li{margin:2px 0}
.check.inline{display:inline-flex;margin:0 0 0 8px;font-size:.82rem}
.check.inline input{width:18px;height:18px}
.warn{color:var(--warn);font-size:.88rem}
.steps{padding-left:20px;margin:8px 0 12px}
.steps li{margin:4px 0}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border:2px solid var(--line);border-radius:8px;background:var(--surface);font-size:.75rem;font-weight:700;cursor:pointer;padding:6px 2px}
.tool svg{width:24px;height:24px}
.tool[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.cur{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.palsep{flex-basis:100%;height:0}
.sw{position:relative;width:40px;height:40px;border-radius:6px;border:2px solid var(--line);padding:0;cursor:pointer;overflow:hidden;flex:none;

.btn.small{min-height:36px;padding:.2em .8em;font-size:.85rem}

</style>

<body>
<main class="app" id="app"><p class="empty">Opening the paint room…</p></main>
<div class="dock" id="dock" hidden><div class="in" id="dockIn"></div></div>

<script>
/* Load the engine for its sprite slots and built-in art (version from version.json, so this page never needs a version bump). */
(function () {
  const go = v => { const s = document.createElement("script"); s.src = "museum-engine.js" + (v ? "?v=" + encodeURIComponent(v) : ""); s.onload = () => window.prStart(); s.onerror = () => { document.getElementById("app").innerHTML = '<p class="empty">Couldn\'t load museum-engine.js. Open this page from the museum folder.</p>'; }; document.head.appendChild(s); };
  if (/^https?:$/.test(location.protocol)) fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(r => (r.ok ? r.json() : {})).then(j => go(j.version), () => go(""));
  else go("");
})();
</script>
<script>
window.prStart = async function () {
"use strict";
const META_KEY = "goq-paint-room", SITE_PACK = "museum-pack.json";
const $app = document.getElementById("app"), $dock = document.getElementById("dock"), $dockIn = document.getElementById("dockIn");
const el = (tag, attrs, kids) => { const e = document.createElement(tag); for (const k in attrs || {}) { const v = attrs[k]; if (v == null || v === false) continue; if (k === "text") e.textContent = v; else if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v); } (kids || []).forEach(c => c != null && e.appendChild(typeof c === "string" ? document.createTextNode(c) : c)); return e; };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function toast(t) { const x = el("div", { class: "toast", role: "status", text: t }); document.body.appendChild(x); setTimeout(() => x.remove(), 1800); }
const plural = (n, one, many) => n + " " + (n === 1 ? one : many || one + "s");

/* ---------- The art library (IndexedDB) ----------
   Stores: art (key → { png, w, h, cols, rows, savedAt, origHash }), kept (key → { at, origHash }),
   wip (key → unsaved pixels, Phase 2), misc (swatches and the like). Falls back to memory (with a warning) if IndexedDB is unavailable. */
const DB = await (async () => {
  const mem = { art: {}, kept: {}, wip: {}, misc: {} };
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open("goq-paint-room", 1);
    r.onupgradeneeded = () => { const d = r.result; for (const s in mem) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked"));
  });
  let db = null;
  try { db = await open(); } catch (e) { db = null; }
  const req = (store, mode, fn) => new Promise((res, rej) => { const t = db.transaction(store, mode), q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  const all = store => new Promise((res, rej) => { const out = {}, t = db.transaction(store), c = t.objectStore(store).openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); });
  if (db) for (const s in mem) { try { mem[s] = await all(s); } catch (e) {} }
  return {
    ok: !!db, data: mem,
    async put(store, key, val) { mem[store][key] = val; if (db) await req(store, "readwrite", s => s.put(val, key)); },
    async del(store, key) { delete mem[store][key]; if (db) await req(store, "readwrite", s => s.delete(key)); },
  };
})();
let meta = { days: {}, total: 0, lastGroup: "", allWings: false };
try { meta = Object.assign(meta, JSON.parse(localStorage.getItem(META_KEY) || "{}")); } catch (e) {}
const saveMeta = () => { try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {} };

/* ---------- The folder's pack (read only: just to see which slots already have custom art) ---------- */
let pack = null;
if (/^https?:$/.test(location.protocol)) {
  try { const r = await fetch(SITE_PACK + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) { const j = await r.json(); if (j && j.format === GOQ.PACK_FORMAT) pack = j; } } catch (e) {}
}
const packAssets = (pack && pack.assets) || {};

/* ---------- Slots and their art ---------- */
const SLOTS = GOQ.SLOTS.filter(s => !s.retired);
const SLOT = Object.fromEntries(SLOTS.map(s => [s.key, s]));
const GROUPS = [...new Set(SLOTS.map(s => s.group))];
const gridOf = s => GOQ.sheetGrid(s);
const sheetSize = s => { const g = gridOf(s); return { w: s.w * g.cols, h: s.h * g.rows, cols: g.cols, rows: g.rows, frames: g.cols * g.rows }; };
const canvasOf = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; return [c, x]; };
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("bad image")); i.src = src; });
// A short fingerprint of a canvas's pixels, so we can tell later if the built-in art changed under a painted sprite.
function pixelHash(c) { const d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data; let h = 0x811c9dc5; for (let i = 0; i < d.length; i++) h = Math.imul(h ^ d[i], 16777619); return (h >>> 0).toString(36) + "." + c.width + "x" + c.height; }

/* ---------- Shop items (the weekly gift) ----------
   Not sprite slots: each is a new shop item with a 16×16 picture, kept in its own record (misc "items": id → { id, name, price,
   description, piece, unveil, png, savedAt, sentAt, sent }), never in the sprite library, so the art-only exports can't pick
   them up. "item:<id>" opens the same painter. Send to the curator adds or updates that one item (and the exhibit's unveil
   date if you changed it) in the curator's draft; nothing else. */
const ITEM_SIZE = 16, isItemKey = k => /^item:/.test(k || "");
const itemsStore = () => DB.data.misc.items || {};
async function putItem(it) { await DB.put("misc", "items", Object.assign({}, itemsStore(), { [it.id]: it })); }
async function delItem(id) { const all = Object.assign({}, itemsStore()); delete all[id]; await DB.put("misc", "items", all); }
function itemSlot(id) {
  const it = itemsStore()[id]; if (!it) return null;
  return { key: "item:" + id, item: id, label: it.name || "New weekly gift", group: "Shop items", w: ITEM_SIZE, h: ITEM_SIZE, frames: 1,
    note: "A shop item: shown in the game as a 16×16 icon. Transparent background, a 1-pixel outline in #181820, 4 to 7 colors, light from the top left (ITEM-ART.md)." };
}
const slotOf = key => SLOT[key] || (isItemKey(key) ? itemSlot(key.slice(5)) : null);
// The curator's draft in this browser (shared with the curator and the Writers' Room), or null.
const DRAFT_KEY = "goq-curator-draft";
const readDraftPack = () => { try { const j = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); return j && j.format === GOQ.PACK_FORMAT ? j : null; } catch (e) { return null; } };

const origCache = {};
const original = key => origCache[key] || (origCache[key] = isItemKey(key) ? canvasOf(ITEM_SIZE, ITEM_SIZE)[0] : GOQ.placeholder(key)); // a new item starts blank
// Images for art that isn't built in (the library's and the folder pack's), decoded once.
const imgCache = {};
async function warm(src) { if (src && !imgCache[src]) { try { imgCache[src] = await loadImg(src); } catch (e) { imgCache[src] = null; } } return imgCache[src]; }
await Promise.all([...Object.values(DB.data.art).map(a => warm(a.png)), ...Object.values(itemsStore()).filter(i => i.png).map(i => warm(i.png)), ...Object.keys(packAssets).filter(k => SLOT[k]).map(k => warm(packAssets[k].src))]);
/* The art the game would show: yours (painted here) first, then the pack's custom art, then the built-in. */
function inUse(key) {
  if (isItemKey(key)) { const it = itemsStore()[key.slice(5)], img = it && it.png && imgCache[it.png], [c, x] = canvasOf(ITEM_SIZE, ITEM_SIZE); if (img) x.drawImage(img, 0, 0, ITEM_SIZE, ITEM_SIZE); return c; }
  const s = SLOT[key], { w, h } = sheetSize(s), a = DB.data.art[key], src = a ? a.png : packAssets[key] && packAssets[key].src, img = src && imgCache[src];
  if (!img) return original(key);
  const [c, x] = canvasOf(w, h); x.drawImage(img, 0, 0, w, h, 0, 0, w, h); return c;
}

/* ---------- Status ---------- */
// painted: art in the library. kept: keep the original. pack: custom art already in the pack (made elsewhere). wip: unsaved work. todo: nothing yet.
function status(key) {
  if (DB.data.art[key]) return "painted";
  if (DB.data.kept[key]) return "kept";
  if (packAssets[key]) return "pack";
  if (DB.data.wip[key]) return "wip";
  return "todo";
}
const isDone = st => st === "painted" || st === "kept" || st === "pack";
const STATUS_TEXT = { todo: "To do", wip: "In progress", painted: "Painted", kept: "Kept original", pack: "Custom art in the pack" };
const sizeOf = s => Math.max(s.w, s.h) <= 8 ? "tiny" : Math.max(s.w, s.h) <= 16 ? "small" : Math.max(s.w, s.h) <= 32 ? "medium" : "large";
const SIZE_TEXT = { tiny: "Tiny (8 px)", small: "Small (16 px)", medium: "Medium (32 px)", large: "Large" };
const framesOf = s => sheetSize(s).frames;
function stamp() { const first = !(meta.days[today()] > 0); meta.days[today()] = (meta.days[today()] || 0) + 1; meta.total = (meta.total || 0) + 1; saveMeta(); return first; }

/* ---------- Drawing sprites for the page ---------- */
// One frame of a sheet (frame 0 is the standing, facing-down pose for characters), scaled to fit a box, crisp.
function frameCanvas(sheet, s, frame, box) {
  const g = gridOf(s), f = frame || 0, fx = (f % g.cols) * s.w, fy = Math.floor(f / g.cols) * s.h;
  const [c, x] = canvasOf(s.w, s.h); x.drawImage(sheet, fx, fy, s.w, s.h, 0, 0, s.w, s.h);
  const k = Math.min(box / s.w, box / s.h, 8), k2 = k >= 1 ? Math.floor(k) : k;
  c.className = "px"; c.style.width = Math.max(1, s.w * k2) + "px"; c.style.height = Math.max(1, s.h * k2) + "px";
  return c;
}
// An animated preview: cycles through the frames (characters walk facing down: stand, step, stand, step).
/* ---------- How a slot's frames are used ----------
   "anim": the frames play as an animation (you can change the preview's play order and speed).
   "set": separate pictures the game shows one at a time: a set to pick from (reactions, cups, carpet pieces) or states it
   switches between (TV off/on, keypad colors). Defaults follow how the engine uses each slot; any slot can be switched.
   This only changes how the Paint Room shows and previews them: the game itself decides which frame shows when. */
const FRAME_SETS = ["cups", "trinkets", "carpet_h", "carpet_v", "held_items", "break_items", "supply_box", "emote", "bubble", "litter",
  "cup_iced", "office_tv", "office_keypad", "fingerprints", "popcorn_bag", "microwave_counter", "theater_screen"];
const ORDER_DEFAULTS = { cat: [0, 1] }; // the cat breathes asleep (1, 2); frame 3 is when you pet it
const FRAME_NAMES = {
  cups: ["coffee", "tea", "cocoa", "drink of the week"], cup_iced: ["full", "empty"], steam: ["low", "rising", "high"],
  carpet_h: ["left end", "middle", "right end"], carpet_v: ["top end", "middle", "bottom end"], office_tv: ["off", "on"], joe: ["antenna off", "antenna lit"],
  held_items: ["headphones", "lunchbox"], break_items: ["headphones", "lunchbox"], supply_box: ["shop stock", "café supplies"],
  cat: ["asleep", "breathing in", "awake"], office_keypad: ["dark", "red", "green"], fingerprints: ["a few", "more", "lots"],
  emote: ["startled !", "heart", "peace sign", "star", "busy …", "wave", "shy", "annoyed"], bubble: ["?", "!"], litter: ["cup", "wrapper", "napkin"],
  popcorn_bag: ["full", "empty"], microwave_counter: ["clean", "after the incident"], marquee_lights: ["bulbs A", "bulbs B"],
};
function frameSettings(s) {
  const m = (DB.data.misc.frameModes || {})[s.key] || {}, n = framesOf(s);
  if (s.layout === "char" || n < 2) return { mode: "anim", order: null, ms: 220, fixed: true };
  const order = (m.order || ORDER_DEFAULTS[s.key] || []).filter(f => f >= 0 && f < n);
  return { mode: m.mode || (FRAME_SETS.includes(s.key) ? "set" : "anim"), order: order.length ? order : [...Array(n).keys()], ms: m.ms || 260, custom: !!m.order };
}
async function setFrameSettings(key, patch) {
  const all = Object.assign({}, DB.data.misc.frameModes || {}), cur = Object.assign({}, all[key] || {}, patch);
  for (const k in cur) if (cur[k] == null) delete cur[k];
  if (Object.keys(cur).length) all[key] = cur; else delete all[key];
  await DB.put("misc", "frameModes", all).catch(() => {});
}
// One frame's name: walk-sheet poses, the names the game gives a set, or just its number.
const CHAR_ROWS = ["down", "up", "left", "right"], CHAR_COLS = ["standing", "step 1", "step 2"];
const frameName = (s, f) => s.layout === "char" ? "Facing " + CHAR_ROWS[Math.floor(f / 3)] + ", " + CHAR_COLS[f % 3]
  : FRAME_NAMES[s.key] && FRAME_NAMES[s.key][f] ? (f + 1) + ": " + FRAME_NAMES[s.key][f] : "Frame " + (f + 1);

// A sprite for the page: an animation plays (in its play order); a set shows all its pictures side by side.
function animated(sheet, s, box) {
  const n = framesOf(s), host = el("div", { class: "chk" }), fs = frameSettings(s);
  if (n > 1 && fs.mode === "set") {
    host.classList.add("setrow"); const each = Math.max(12, Math.min(box, Math.floor((box * 2.2) / n)));
    for (let f = 0; f < n; f++) { const c = frameCanvas(sheet, s, f, each); c.title = frameName(s, f); host.appendChild(c); }
    return host;
  }
  let cv = frameCanvas(sheet, s, 0, box); host.appendChild(cv);
  if (n > 1) {
    const seq = s.layout === "char" ? [0, 1, 0, 2] : fs.order; let i = 0;
    cv.remove(); cv = frameCanvas(sheet, s, seq[0], box); host.appendChild(cv);
    const t = setInterval(() => { if (!host.isConnected) return clearInterval(t); i = (i + 1) % seq.length; const nc = frameCanvas(sheet, s, seq[i], box); host.replaceChild(nc, cv); cv = nc; }, fs.ms);
  }
  return host;
}

/* ---------- Navigation ---------- */
// A reload (phones do this to tabs left in the background) reopens where you were; a fresh visit starts at home.
const navType = ((performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || {}).type;
let view = (navType === "reload" || navType === "back_forward") && history.state && history.state.v || { name: "home" }; const skipped = new Set();
function go(v, replace) { view = v; if (replace) history.replaceState({ v }, ""); else history.pushState({ v }, ""); render(); scrollTo(0, 0); }
window.addEventListener("popstate", e => { view = (e.state && e.state.v) || { name: "home" }; render(); });
history.replaceState({ v: view }, "");
function dock(buttons) { $dockIn.innerHTML = ""; if (!buttons) { $dock.hidden = true; $app.classList.add("nobar"); return; } buttons.forEach(b => b && $dockIn.appendChild(b)); $dock.hidden = false; $app.classList.remove("nobar"); }
function top(title, back) {
  return el("header", { class: "top" }, [back ? el("button", { class: "iconbtn", type: "button", "aria-label": "Back", text: "←", onclick: () => history.length > 1 ? history.back() : go({ name: "home" }) }) : null,
    back ? el("div", { class: "crumb", text: title }) : el("h1", { text: title })]);
}
function render() {
  if (editor) { editor.close(); editor = null; }
  $app.innerHTML = "";
  if (view.name === "home") return renderHome();
  if (view.name === "find") return renderFind();
  if (view.name === "slot") return SLOT[view.key] ? renderSlot() : go({ name: "home" }, true);
  if (view.name === "paint") return slotOf(view.key) ? renderPaint() : go({ name: "home" }, true);
  if (view.name === "items") return renderItems();
  if (view.name === "item") return itemsStore()[view.id] ? renderItem() : go({ name: "items" }, true);
  if (view.name === "export") return renderExport();
}

/* ---------- Picking today's sprite ----------
   In-progress ones first, then to-dos in the group you worked in last, then the rest; smaller sprites before big ones. */
function nextSlot(after) {
  const area = s => s.w * s.h * framesOf(s);
  const pool = SLOTS.filter(s => s.key !== after && !skipped.has(s.key));
  const rank = s => (status(s.key) === "wip" ? 0 : 2) + (meta.lastGroup && s.group === meta.lastGroup ? 0 : 1);
  const list = pool.filter(s => status(s.key) === "wip" || status(s.key) === "todo").sort((a, b) => rank(a) - rank(b) || area(a) - area(b));
  if (list.length) return list[0];
  if (skipped.size) { skipped.clear(); return nextSlot(after); }
  return null;
}

/* ---------- Home ---------- */
function renderHome() {
  dock(null);
  $app.appendChild(top("Paint Room"));
  if (!DB.ok) $app.appendChild(el("div", { class: "banner", text: "This browser won't let the Paint Room keep a library (private browsing?), so anything you do here is lost when you close the page." }));
  if (!pack && /^https?:$/.test(location.protocol)) $app.appendChild(el("div", { class: "banner info", text: "Couldn't read this folder's museum-pack.json, so art made elsewhere doesn't show here. Your own library is fine." }));

  // Today
  const stampedToday = (meta.days[today()] || 0) > 0, next = nextSlot();
  const t = el("section", { class: "panel today", "aria-labelledby": "h-today" });
  t.appendChild(el("h2", { id: "h-today", text: stampedToday ? "Stamped for today" : "Today's sprite" }));
  if (next) {
    const st = status(next.key), z = sheetSize(next);
    t.appendChild(el("div", { class: "pick" }, [animated(inUse(next.key), next, 72),
      el("div", {}, [el("p", { class: "what", text: next.label }), el("p", { class: "where", text: next.group + " · " + next.w + "×" + next.h + (z.frames > 1 ? ", " + z.frames + " frames" : "") + (st === "wip" ? " · in progress" : "") })])]));
    t.appendChild(el("div", { class: "acts" }, [
      el("button", { class: "btn quiet", type: "button", text: "Another", onclick: () => { skipped.add(next.key); render(); } }),
      el("button", { class: "btn primary", type: "button", text: stampedToday ? "One more" : "Open it", onclick: () => go({ name: "slot", key: next.key }) })]));
  } else t.appendChild(el("p", { class: "where", text: "Every sprite is painted or kept. The whole museum is yours." }));
  $app.appendChild(t);

      for (let x = 8; x < s.w; x += 8) ctx.fillRect(ox + x * z, oy, 1 / dpr, s.h * z);
      for (let y = 8; y < s.h; y += 8) ctx.fillRect(ox, oy + y * z, s.w * z, 1 / dpr);
    }
    ctx.restore();
    ctx.strokeStyle = col("--line"); ctx.lineWidth = 1; ctx.strokeRect(ox - .5, oy - .5, s.w * z + 1, s.h * z + 1);
    if (mirror) { ctx.save(); ctx.strokeStyle = "rgba(240,184,64,.9)"; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.beginPath();
      if (mirror.includes("x")) { ctx.moveTo(ox + s.w * z / 2, oy); ctx.lineTo(ox + s.w * z / 2, oy + s.h * z); }
      if (mirror.includes("y")) { ctx.moveTo(ox, oy + s.h * z / 2); ctx.lineTo(ox + s.w * z, oy + s.h * z / 2); }
      ctx.stroke(); ctx.restore(); }
    if (sel) { const X = ox + sel.x * z, Y = oy + sel.y * z, Wd = sel.w * z, Hd = sel.h * z; ctx.save(); ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      ctx.strokeStyle = "#fff"; ctx.strokeRect(X, Y, Wd, Hd); ctx.strokeStyle = "#111"; ctx.lineDashOffset = 4.5; ctx.strokeRect(X, Y, Wd, Hd); ctx.restore(); }
    // previews and frame thumbnails
    pvC.forEach(c => { const x = c.getContext("2d"); x.clearRect(0, 0, s.w, s.h); x.drawImage(sheetC, fx, fy, s.w, s.h, 0, 0, s.w, s.h); });
    setC.forEach((c, f) => { const x = c.getContext("2d"); x.clearRect(0, 0, s.w, s.h); x.drawImage(sheetC, (f % Z.cols) * s.w, Math.floor(f / Z.cols) * s.h, s.w, s.h, 0, 0, s.w, s.h); c.classList.toggle("on", f === frame); });
    frameBtns.forEach((btn, f) => { btn.setAttribute("aria-current", f === frame ? "true" : "false"); const c = btn.firstChild, x = c.getContext("2d"); x.clearRect(0, 0, s.w, s.h); x.drawImage(sheetC, (f % Z.cols) * s.w, Math.floor(f / Z.cols) * s.h, s.w, s.h, 0, 0, s.w, s.h); });
    frameLabel.textContent = Z.frames > 1 ? frameName(s, frame) + " (" + (frame + 1) + "/" + Z.frames + ")" + (gf != null && gf !== frame ? " · ghost: " + frameName(s, gf).toLowerCase() : "") : "";
    undoB.disabled = !undo.length; redoB.disabled = !redo.length;
    drawScene(); ctxQueue();
  }
  // The animation preview ticks on its own (characters walk facing the way the current frame faces).
  let animF = 0, animT = 0;
  const tick = () => {
    const seq = s.layout === "char" ? [0, 1, 0, 2].map(c => Math.floor(frame / 3) * 3 + c) : fset.order;
    animF = (animF + 1) % seq.length; const f = seq[animF], x = animC.getContext("2d");
    x.clearRect(0, 0, s.w, s.h); x.drawImage(sheetC, (f % Z.cols) * s.w, Math.floor(f / Z.cols) * s.h, s.w, s.h, 0, 0, s.w, s.h);
    animT = setTimeout(tick, s.layout === "char" ? 220 : fset.ms);
  };
  if (animC) animT = setTimeout(tick, 260);

  /* Input: one pointer paints; a second finger cancels the stroke and pinches to zoom and pan. */
  const pts = new Map(); let stroke = null, pinch = null;
  const at = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const cell = p => ({ x: Math.floor((p.x - ox) / z), y: Math.floor((p.y - oy) / z) });
  function apply(c, first, p) {
    if (trace && trace.moving) { if (first) stroke.tr = { x: p.x, y: p.y, tx: trace.x, ty: trace.y }; else { trace.x = stroke.tr.tx + (p.x - stroke.tr.x) / z; trace.y = stroke.tr.ty + (p.y - stroke.tr.y) / z; draw(); } return; }
    if (tool === "move") { if (first) stroke.pan = { x: p.x, y: p.y, ox, oy }; else { ox = stroke.pan.ox + p.x - stroke.pan.x; oy = stroke.pan.oy + p.y - stroke.pan.y; draw(); } return; }
    if (tool === "pick") { if (c.x < 0 || c.y < 0 || c.x >= s.w || c.y >= s.h) return; const k = getPx(c.x, c.y); if ((k & 255) === 0) { setTool("eraser"); paintPalette(); } else { color = k; paintPalette(); } return; }
    if (tool === "fill") { if (first) mirrorPts(c.x, c.y).forEach(([x, y]) => flood(x, y, color)); return draw(); }
    if (tool === "line" || tool === "rect" || tool === "oval") { if (first) stroke.anchor = c; px = stroke.before.slice(); shape(stroke.anchor, c, color); return draw(); }
    if (tool === "select") return selPointer(c, first);
    const k = tool === "eraser" ? 0 : color;
    if (stroke.last) line(stroke.last.x, stroke.last.y, c.x, c.y, k); else setPx(c.x, c.y, k);
    stroke.last = c; draw();
  }
  cv.addEventListener("pointerdown", e => {
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} pts.set(e.pointerId, at(e));
    if (pts.size === 1 && !pinch) { stroke = { before: px.slice(), last: null }; apply(cell(at(e)), true, at(e)); }
    else if (pts.size === 2) {
      if (stroke) { px = stroke.before; if (stroke.drag && sel) { sel.x = stroke.drag.sx; sel.y = stroke.drag.sy; } stroke = null; draw(); } // a second finger: this was a zoom, not a stroke
      const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, z, ox, oy };
    }

  cv.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, at(e));

      const nz = Math.max(0.5, Math.min(64, pinch.z * d / pinch.d));
      ox = mx - (pinch.mx - pinch.ox) * nz / pinch.z; oy = my - (pinch.my - pinch.oy) * nz / pinch.z; z = nz; draw();
    } else if (stroke && (tool !== "fill" || (trace && trace.moving))) apply(cell(at(e)), false, at(e));
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if (stroke && !pts.size) { const b = stroke.before, tr = stroke.tr; stroke = null; if (tr) draw(); else if (tool === "pick") { setTool("pencil"); paintPalette(); } else if (tool !== "move") commitStroke(b); }
    if (!pts.size) pinch = null;
  };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  cv.addEventListener("wheel", e => { e.preventDefault(); const p = at(e); zoomBy(e.deltaY < 0 ? 1.25 : 0.8, p.x, p.y); }, { passive: false });
  const onKey = e => {
    if (e.target.closest && e.target.closest("input,textarea,select")) return;
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (mod && k === "z") { e.preventDefault(); e.shiftKey ? step(redo, undo) : step(undo, redo); }
    else if (mod && k === "y") { e.preventDefault(); step(redo, undo); }
    else if (mod && k === "c" && !String(getSelection())) { e.preventDefault(); sel ? selCopy() : copyFrame(); }
    else if (mod && k === "v") { e.preventDefault(); selClip && (sel || tool === "select") ? selPaste() : pasteFrame(); }
    else if (k === "escape" && sel) { dropSel(); draw(); }
    else if ((k === "delete" || k === "backspace") && sel) { e.preventDefault(); selDo(f => ({ w: f.w, h: f.h, px: new Uint8ClampedArray(f.px.length) })); }
    else if (!mod && { l: 1, r: 1, c: 1, s: 1 }[k]) setTool({ l: "line", r: "rect", c: "oval", s: "select" }[k]);
    else if (!mod && k === "x") mirrorB.click();
    else if (!mod && Z.frames > 1 && (k === "," || k === "<" || k === "[")) goFrame(frame - 1);
    else if (!mod && Z.frames > 1 && (k === "." || k === ">" || k === "]")) goFrame(frame + 1);
    else if (!mod && k === "o" && Z.frames > 1) ghostB.click();
    else if (!mod && { b: 1, p: 1, e: 1, f: 1, g: 1, i: 1, h: 1, m: 1 }[k]) setTool({ b: "pencil", p: "pencil", e: "eraser", f: "fill", g: "fill", i: "pick", h: "move", m: "move" }[k]);
  };
  /* When the grid's box changes size (rotating the phone; older browsers also resize it as the address bar slides away
     while you scroll), keep your zoom and keep the same spot in the middle. Only the first layout fits the sprite. */
  const onResize = () => { const w0 = cw, h0 = ch; size(); if (!w0 || !h0) fit(); else { ox += (cw - w0) / 2; oy += (ch - h0) / 2; } draw(); pipDraw(); };
  const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(() => { const r = stage.getBoundingClientRect(); if (Math.abs(r.width - cw) > 0.5 || Math.abs(r.height - ch) > 0.5) onResize(); }) : null;
  document.addEventListener("keydown", onKey); if (ro) ro.observe(stage); else window.addEventListener("resize", onResize);
  editor = { key, close() { if (wipT) { clearTimeout(wipT); saveWip(); } clearTimeout(animT); ctxClose(); document.removeEventListener("keydown", onKey); if (ro) ro.disconnect(); else window.removeEventListener("resize", onResize); } };

  // Painting order on a phone: the grid, then the zoom row, tools, selection bar and colors right under it;
  // frames, frame settings, the trace and More follow.
  zoomRow.after(tools, selBar, palPanel);
  setTool("pencil"); paintChips(); paintPalette(); paintTrace(); if (!fset.fixed) paintFs(); size(); fit(); paint(); ctxSetup();
}

await document.fonts.ready.catch(() => {});
render();
};
