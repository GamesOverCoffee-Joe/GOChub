<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Paint Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* The paint room: repaint the museum's sprites one at a time, a little every day. Phone first.
   Art only: it keeps its own art library (IndexedDB) and never writes the curator's draft or anything else in the pack.
   The plan and handoff live in PAINT-ROOM-PLAN.md. */
:root{
  --bg:#f1e4df;--surface:#fffaf7;--surface-2:#f6ebe6;--line:#d9c0b8;--text:#2a171c;--muted:#6d5157;
  --gold:#8f5a0a;--on-gold:#fff8ec;--warn:#a33a22;--ok:#3f7a2a;--shadow:#d9c0b8;--todo:#c0532e;--lit:#f0b840;--dark-room:#3a2a30;
  --wip:#5a7ac0;--pack:#7a5ab0;--check-a:#e8dcd6;--check-b:#f8f0ec;
  --pixel:'Press Start 2P',ui-monospace,monospace;--body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1317;--surface:#281a1f;--surface-2:#34232a;--line:#4b343b;--text:#f3e5d0;--muted:#b59e8c;
  --gold:#e8b24a;--on-gold:#2a1a10;--warn:#f08a6a;--ok:#9fcf7a;--shadow:#0e080a;--todo:#f08a6a;--lit:#f0c050;--dark-room:#120b0e;
  --wip:#8aa8f0;--pack:#b89ae8;--check-a:#2e2025;--check-b:#3a2a30;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1d1317;--surface:#281a1f;--surface-2:#34232a;--line:#4b343b;--text:#f3e5d0;--muted:#b59e8c;
  --gold:#e8b24a;--on-gold:#2a1a10;--warn:#f08a6a;--ok:#9fcf7a;--shadow:#0e080a;--todo:#f08a6a;--lit:#f0c050;--dark-room:#120b0e;
  --wip:#8aa8f0;--pack:#b89ae8;--check-a:#2e2025;--check-b:#3a2a30;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none !important}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 112px)}
.app.nobar{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}

/* Top bar */
.top{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:12px}
.top h1{font-family:var(--pixel);font-weight:400;font-size:13px;line-height:1.5;color:var(--gold);margin:0;flex:1;min-width:0}
.top .crumb{font-size:.85rem;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:2px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:700;padding:0 10px}
.iconbtn:active{transform:translateY(1px)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:48px;padding:.5em 1.1em;border:2px solid var(--text);background:var(--surface);
  border-radius:6px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;font-weight:700;font-size:1rem;text-decoration:none;color:var(--text)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.quiet{border-color:var(--line);box-shadow:none;font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.small{font-size:.85rem;color:var(--muted)}

/* Cards */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px}
.panel h2{font-family:var(--pixel);font-weight:400;font-size:11px;line-height:1.6;margin:0 0 10px;color:var(--text)}
.today{border-color:var(--gold);box-shadow:4px 4px 0 var(--shadow)}
.today .pick{display:flex;gap:14px;align-items:center;margin:0 0 14px}
.today .what{font-weight:700;font-size:1.05rem;line-height:1.35;margin:0 0 2px}
.today .where{font-size:.85rem;color:var(--muted);margin:0}
.today .acts{display:flex;gap:10px}
.today .acts .btn{flex:1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:76px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.tile b{font-size:.98rem;line-height:1.25}
.tile span{font-size:.82rem;color:var(--muted)}
.tile:active{transform:translateY(1px)}

/* A sprite on a checkerboard */
.chk{background-color:var(--check-b);background-image:linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%),linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.today .chk{flex:none;width:84px;height:84px;border:2px solid var(--line)}

/* Punch card */
.punch-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.punch-head h2{margin:0}
.punch{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.punch .dow{font-size:.7rem;color:var(--muted);text-align:center}
.punch .d{aspect-ratio:1;border:2px dashed var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);position:relative}
.punch .d.blank{border:0}
.punch .d.today{border-style:solid;border-color:var(--gold);color:var(--text);font-weight:700}
.punch .d.hit{border:0;background:var(--gold);color:var(--on-gold);font-weight:700}
.punch .d.hit::after{content:"";position:absolute;inset:3px;border:2px solid var(--on-gold);border-radius:50%;opacity:.55}
.punch .d.future{opacity:.4}
.punch-foot{margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.stamp-in{animation:stampin .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampin{0%{transform:scale(2.4) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}

/* Gallery wings: one per group, lighting up as its sprites get done */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.room{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:96px}
.room .win{height:30px;border-radius:4px;background:var(--dark-room);position:relative;overflow:hidden;border:2px solid var(--line)}
.room .win i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--lit),#ffe08a);box-shadow:0 0 14px var(--lit);transition:width .6s}
.room .win.full{box-shadow:0 0 12px var(--lit)}
.room b{font-size:.86rem;line-height:1.25}
.room span{font-size:.76rem;color:var(--muted)}
.room .badge{position:absolute;top:-8px;right:-6px;background:var(--gold);color:var(--on-gold);font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px}
.room:active{transform:translateY(1px)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--lit)}

/* Find */
.search{width:100%;min-height:48px;border:2px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;font-size:16px}
.search:focus{border-color:var(--gold);outline:none}
select.search{appearance:auto;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.count{margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
.sp{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.sp:active{transform:translateY(1px)}
.sp .chk{height:72px}
.sp b{font-size:.78rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.sp .dot{position:absolute;top:6px;right:6px}
.ghead{grid-column:1/-1;margin:10px 0 0;font-weight:700;font-size:.85rem}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);display:inline-block}
.dot.todo{background:var(--todo);border-color:var(--todo)}
.dot.wip{background:var(--wip);border-color:var(--wip)}
.dot.painted{background:var(--lit);border-color:var(--gold)}
.dot.kept{background:var(--surface);border-color:var(--gold)}
.dot.pack{background:var(--pack);border-color:var(--pack)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px}

/* One sprite */
.who{font-weight:700;font-size:1.1rem;line-height:1.35;margin:0 0 4px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tag{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;border:2px solid var(--line);color:var(--muted)}
.tag.todo{border-color:var(--todo);color:var(--todo)}
.tag.painted,.tag.kept{border-color:var(--gold);color:var(--gold)}
.tag.wip{border-color:var(--wip);color:var(--wip)}
.tag.pack{border-color:var(--pack);color:var(--pack)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.views figure{margin:0}
.views figcaption{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 4px}
.views .chk{height:150px;border:2px solid var(--line)}
.views.one{grid-template-columns:1fr}
.brief{background:var(--surface-2);border-left:4px solid var(--gold);border-radius:6px;padding:10px 12px;margin:0 0 14px;font-size:.92rem}
.brief b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem;margin:0 0 14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:700}

/* The bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:2px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px)}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}

/* After a save */
.done{position:fixed;inset:0;z-index:20;background:rgba(20,10,14,.62);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.done .sheet{width:100%;max-width:560px;background:var(--surface);border-radius:16px 16px 0 0;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;animation:rise .28s cubic-bezier(.2,1.2,.4,1) both}
.done .big{font-family:var(--pixel);font-size:18px;line-height:1.5;color:var(--gold);margin:6px 0 6px;display:inline-block}
.done p{margin:0 0 16px;color:var(--muted)}
.done .acts{display:flex;gap:10px}
.done .acts .btn{flex:1}
.seal{width:84px;height:84px;margin:0 auto 6px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:10px;line-height:1.3;position:relative}
.seal::after{content:"";position:absolute;inset:6px;border:3px solid var(--on-gold);border-radius:50%;opacity:.6}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.banner{background:var(--surface-2);border:2px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:.86rem;margin:0 0 14px}
.banner.info{border-color:var(--gold)}
.foot{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.foot .small{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:700;font-size:.85rem;z-index:30;animation:fade .2s both}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<main class="app" id="app"><p class="empty">Opening the paint room…</p></main>
<div class="dock" id="dock" hidden><div class="in" id="dockIn"></div></div>

<script>
/* Load the engine for its sprite slots and built-in art (version from version.json, so this page never needs a version bump). */
(function () {
  const go = v => { const s = document.createElement("script"); s.src = "museum-engine.js" + (v ? "?v=" + encodeURIComponent(v) : ""); s.onload = () => window.prStart(); s.onerror = () => { document.getElementById("app").innerHTML = '<p class="empty">Couldn\'t load museum-engine.js. Open this page from the museum folder.</p>'; }; document.head.appendChild(s); };
  if (/^https?:$/.test(location.protocol)) fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(r => (r.ok ? r.json() : {})).then(j => go(j.version), () => go(""));
  else go("");
})();
</script>
<script>
window.prStart = async function () {
"use strict";
const META_KEY = "goq-paint-room", SITE_PACK = "museum-pack.json";
const $app = document.getElementById("app"), $dock = document.getElementById("dock"), $dockIn = document.getElementById("dockIn");
const el = (tag, attrs, kids) => { const e = document.createElement(tag); for (const k in attrs || {}) { const v = attrs[k]; if (v == null || v === false) continue; if (k === "text") e.textContent = v; else if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v); } (kids || []).forEach(c => c != null && e.appendChild(typeof c === "string" ? document.createTextNode(c) : c)); return e; };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function toast(t) { const x = el("div", { class: "toast", role: "status", text: t }); document.body.appendChild(x); setTimeout(() => x.remove(), 1800); }
const plural = (n, one, many) => n + " " + (n === 1 ? one : many || one + "s");

/* ---------- The art library (IndexedDB) ----------
   Stores: art (key → { png, w, h, cols, rows, savedAt, origHash }), kept (key → { at, origHash }),
   wip (key → unsaved pixels, Phase 2), misc (swatches and the like). Falls back to memory (with a warning) if IndexedDB is unavailable. */
const DB = await (async () => {
  const mem = { art: {}, kept: {}, wip: {}, misc: {} };
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open("goq-paint-room", 1);
    r.onupgradeneeded = () => { const d = r.result; for (const s in mem) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked"));
  });
  let db = null;
  try { db = await open(); } catch (e) { db = null; }
  const req = (store, mode, fn) => new Promise((res, rej) => { const t = db.transaction(store, mode), q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  const all = store => new Promise((res, rej) => { const out = {}, t = db.transaction(store), c = t.objectStore(store).openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); });
  if (db) for (const s in mem) { try { mem[s] = await all(s); } catch (e) {} }
  return {
    ok: !!db, data: mem,
    async put(store, key, val) { mem[store][key] = val; if (db) await req(store, "readwrite", s => s.put(val, key)); },
    async del(store, key) { delete mem[store][key]; if (db) await req(store, "readwrite", s => s.delete(key)); },
  };
})();
let meta = { days: {}, total: 0, lastGroup: "", allWings: false };
try { meta = Object.assign(meta, JSON.parse(localStorage.getItem(META_KEY) || "{}")); } catch (e) {}
const saveMeta = () => { try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {} };

/* ---------- The folder's pack (read only: just to see which slots already have custom art) ---------- */
let pack = null;
if (/^https?:$/.test(location.protocol)) {
  try { const r = await fetch(SITE_PACK + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) { const j = await r.json(); if (j && j.format === GOQ.PACK_FORMAT) pack = j; } } catch (e) {}
}
const packAssets = (pack && pack.assets) || {};

/* ---------- Slots and their art ---------- */
const SLOTS = GOQ.SLOTS.filter(s => !s.retired);
const SLOT = Object.fromEntries(SLOTS.map(s => [s.key, s]));
const GROUPS = [...new Set(SLOTS.map(s => s.group))];
const gridOf = s => GOQ.sheetGrid(s);
const sheetSize = s => { const g = gridOf(s); return { w: s.w * g.cols, h: s.h * g.rows, cols: g.cols, rows: g.rows, frames: g.cols * g.rows }; };
const canvasOf = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; return [c, x]; };
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("bad image")); i.src = src; });
// A short fingerprint of a canvas's pixels, so we can tell later if the built-in art changed under a painted sprite.
function pixelHash(c) { const d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data; let h = 0x811c9dc5; for (let i = 0; i < d.length; i++) h = Math.imul(h ^ d[i], 16777619); return (h >>> 0).toString(36) + "." + c.width + "x" + c.height; }

const origCache = {};
const original = key => origCache[key] || (origCache[key] = GOQ.placeholder(key));
// Images for art that isn't built in (the library's and the folder pack's), decoded once.
const imgCache = {};
async function warm(src) { if (src && !imgCache[src]) { try { imgCache[src] = await loadImg(src); } catch (e) { imgCache[src] = null; } } return imgCache[src]; }
await Promise.all([...Object.values(DB.data.art).map(a => warm(a.png)), ...Object.keys(packAssets).filter(k => SLOT[k]).map(k => warm(packAssets[k].src))]);
/* The art the game would show: yours (painted here) first, then the pack's custom art, then the built-in. */
function inUse(key) {
  const s = SLOT[key], { w, h } = sheetSize(s), a = DB.data.art[key], src = a ? a.png : packAssets[key] && packAssets[key].src, img = src && imgCache[src];
  if (!img) return original(key);
  const [c, x] = canvasOf(w, h); x.drawImage(img, 0, 0, w, h, 0, 0, w, h); return c;
}

/* ---------- Status ---------- */
// painted: art in the library. kept: keep the original. pack: custom art already in the pack (made elsewhere). wip: unsaved work. todo: nothing yet.
function status(key) {
  if (DB.data.art[key]) return "painted";
  if (DB.data.kept[key]) return "kept";
  if (packAssets[key]) return "pack";
  if (DB.data.wip[key]) return "wip";
  return "todo";
}
const isDone = st => st === "painted" || st === "kept" || st === "pack";
const STATUS_TEXT = { todo: "To do", wip: "In progress", painted: "Painted", kept: "Kept original", pack: "Custom art in the pack" };
const sizeOf = s => Math.max(s.w, s.h) <= 8 ? "tiny" : Math.max(s.w, s.h) <= 16 ? "small" : Math.max(s.w, s.h) <= 32 ? "medium" : "large";
const SIZE_TEXT = { tiny: "Tiny (8 px)", small: "Small (16 px)", medium: "Medium (32 px)", large: "Large" };
const framesOf = s => sheetSize(s).frames;
function stamp() { const first = !(meta.days[today()] > 0); meta.days[today()] = (meta.days[today()] || 0) + 1; meta.total = (meta.total || 0) + 1; saveMeta(); return first; }

/* ---------- Drawing sprites for the page ---------- */
// One frame of a sheet (frame 0 is the standing, facing-down pose for characters), scaled to fit a box, crisp.
function frameCanvas(sheet, s, frame, box) {
  const g = gridOf(s), f = frame || 0, fx = (f % g.cols) * s.w, fy = Math.floor(f / g.cols) * s.h;
  const [c, x] = canvasOf(s.w, s.h); x.drawImage(sheet, fx, fy, s.w, s.h, 0, 0, s.w, s.h);
  const k = Math.min(box / s.w, box / s.h, 8), k2 = k >= 1 ? Math.floor(k) : k;
  c.className = "px"; c.style.width = Math.max(1, s.w * k2) + "px"; c.style.height = Math.max(1, s.h * k2) + "px";
  return c;
}
// An animated preview: cycles through the frames (characters walk facing down: stand, step, stand, step).
function animated(sheet, s, box) {
  const n = framesOf(s), host = el("div", { class: "chk" });
  let cv = frameCanvas(sheet, s, 0, box); host.appendChild(cv);
  if (n > 1) {
    const seq = s.layout === "char" ? [0, 1, 0, 2] : [...Array(n).keys()]; let i = 0;
    const t = setInterval(() => { if (!host.isConnected) return clearInterval(t); i = (i + 1) % seq.length; const nc = frameCanvas(sheet, s, seq[i], box); host.replaceChild(nc, cv); cv = nc; }, s.layout === "char" ? 220 : 260);
  }
  return host;
}

/* ---------- Navigation ---------- */
let view = { name: "home" }; const skipped = new Set();
function go(v, replace) { view = v; if (replace) history.replaceState({ v }, ""); else history.pushState({ v }, ""); render(); scrollTo(0, 0); }
window.addEventListener("popstate", e => { view = (e.state && e.state.v) || { name: "home" }; render(); });
history.replaceState({ v: view }, "");
function dock(buttons) { $dockIn.innerHTML = ""; if (!buttons) { $dock.hidden = true; $app.classList.add("nobar"); return; } buttons.forEach(b => b && $dockIn.appendChild(b)); $dock.hidden = false; $app.classList.remove("nobar"); }
function top(title, back) {
  return el("header", { class: "top" }, [back ? el("button", { class: "iconbtn", type: "button", "aria-label": "Back", text: "←", onclick: () => history.length > 1 ? history.back() : go({ name: "home" }) }) : null,
    back ? el("div", { class: "crumb", text: title }) : el("h1", { text: title })]);
}
function render() {
  $app.innerHTML = "";
  if (view.name === "home") return renderHome();
  if (view.name === "find") return renderFind();
  if (view.name === "slot") return SLOT[view.key] ? renderSlot() : go({ name: "home" }, true);
}

/* ---------- Picking today's sprite ----------
   In-progress ones first, then to-dos in the group you worked in last, then the rest; smaller sprites before big ones. */
function nextSlot(after) {
  const area = s => s.w * s.h * framesOf(s);
  const pool = SLOTS.filter(s => s.key !== after && !skipped.has(s.key));
  const rank = s => (status(s.key) === "wip" ? 0 : 2) + (meta.lastGroup && s.group === meta.lastGroup ? 0 : 1);
  const list = pool.filter(s => status(s.key) === "wip" || status(s.key) === "todo").sort((a, b) => rank(a) - rank(b) || area(a) - area(b));
  if (list.length) return list[0];
  if (skipped.size) { skipped.clear(); return nextSlot(after); }
  return null;
}

/* ---------- Home ---------- */
function renderHome() {
  dock(null);
  $app.appendChild(top("Paint Room"));
  if (!DB.ok) $app.appendChild(el("div", { class: "banner", text: "This browser won't let the Paint Room keep a library (private browsing?), so anything you do here is lost when you close the page." }));
  if (!pack && /^https?:$/.test(location.protocol)) $app.appendChild(el("div", { class: "banner info", text: "Couldn't read this folder's museum-pack.json, so art made elsewhere doesn't show here. Your own library is fine." }));

  // Today
  const stampedToday = (meta.days[today()] || 0) > 0, next = nextSlot();
  const t = el("section", { class: "panel today", "aria-labelledby": "h-today" });
  t.appendChild(el("h2", { id: "h-today", text: stampedToday ? "Stamped for today" : "Today's sprite" }));
  if (next) {
    const st = status(next.key), z = sheetSize(next);
    t.appendChild(el("div", { class: "pick" }, [animated(inUse(next.key), next, 72),
      el("div", {}, [el("p", { class: "what", text: next.label }), el("p", { class: "where", text: next.group + " · " + next.w + "×" + next.h + (z.frames > 1 ? ", " + z.frames + " frames" : "") + (st === "wip" ? " · in progress" : "") })])]));
    t.appendChild(el("div", { class: "acts" }, [
      el("button", { class: "btn quiet", type: "button", text: "Another", onclick: () => { skipped.add(next.key); render(); } }),
      el("button", { class: "btn primary", type: "button", text: stampedToday ? "One more" : "Open it", onclick: () => go({ name: "slot", key: next.key }) })]));
  } else t.appendChild(el("p", { class: "where", text: "Every sprite is painted or kept. The whole museum is yours." }));
  $app.appendChild(t);

  $app.appendChild(punchCard());

  // Quick tiles
  const n = st => SLOTS.filter(s => status(s.key) === st).length;
  $app.appendChild(el("div", { class: "pair" }, [
    el("button", { class: "tile", type: "button", onclick: () => go({ name: "find", filter: n("wip") ? "wip" : "todo" }) }, [el("b", { text: n("wip") ? "In progress" : "To do" }), el("span", { text: n("wip") ? plural(n("wip"), "sprite") + " started" : plural(n("todo"), "sprite") + " left" })]),
    el("button", { class: "tile", type: "button", onclick: () => go({ name: "find", filter: "painted" }) }, [el("b", { text: "Painted" }), el("span", { text: plural(n("painted"), "sprite") + " yours" })]),
  ]));

  // The wings light up
  const done = SLOTS.filter(s => isDone(status(s.key))).length;
  const m = el("section", { class: "panel", "aria-labelledby": "h-wings" }, [el("h2", { id: "h-wings", text: "The wings" })]);
  m.appendChild(el("p", { class: "small", style: "margin:-4px 0 6px", text: done + " of " + SLOTS.length + " sprites painted or kept. Each wing lights up as its sprites get done." }));
  m.appendChild(el("div", { class: "bar", style: "margin-bottom:12px" }, [el("i", { style: "width:" + Math.round(done / SLOTS.length * 100) + "%" })]));
  const grid = el("div", { class: "rooms" }), more = el("div", { class: "rooms", style: "margin-top:10px" });
  const wings = GROUPS.map(g => { const list = SLOTS.filter(s => s.group === g); return { g, list, d: list.filter(s => isDone(status(s.key))).length, w: list.filter(s => status(s.key) === "wip").length }; });
  const rank = a => a.w ? 0 : a.d && a.d < a.list.length ? 1 : a.d < a.list.length ? 2 : 3; // started, half-lit, dark, then fully lit
  wings.sort((a, b) => rank(a) - rank(b));
  const shown = Math.max(6, wings.filter(a => rank(a) < 2).length);
  wings.forEach(({ g, list, d }, i) => {
    const pct = Math.round(d / list.length * 100);
    (i < shown ? grid : more).appendChild(el("button", { class: "room", type: "button", "aria-label": g + ": " + d + " of " + list.length + " done", onclick: () => go({ name: "find", group: g, filter: "all" }) }, [
      pct === 100 ? el("span", { class: "badge", text: "★" }) : null,
      el("div", { class: "win" + (pct === 100 ? " full" : "") }, [el("i", { style: "width:" + pct + "%" })]),
      el("b", { text: g }), el("span", { text: d + " / " + list.length })]));
  });
  m.appendChild(grid);
  if (more.children.length) {
    more.hidden = !meta.allWings;
    const label = () => meta.allWings ? "Show fewer wings" : "Show all " + wings.length + " wings";
    const b = el("button", { class: "btn quiet wide", type: "button", style: "margin-top:12px", "aria-expanded": meta.allWings ? "true" : "false", text: label(), onclick: () => { meta.allWings = !meta.allWings; saveMeta(); more.hidden = !meta.allWings; b.setAttribute("aria-expanded", meta.allWings ? "true" : "false"); b.textContent = label(); } });
    m.appendChild(more); m.appendChild(b);
  }
  $app.appendChild(m);

  $app.appendChild(el("div", { class: "foot" }, [
    el("button", { class: "btn wide", type: "button", text: "Find a sprite", onclick: () => go({ name: "find", filter: "all" }) }),
    el("a", { class: "btn quiet wide", href: "writers-room.html", text: "Writers' Room" }),
    el("a", { class: "btn quiet wide", href: "curator.html", text: "Open the curator" }),
    el("p", { class: "small", text: "Art only: the Paint Room keeps your sprites in its own library in this browser and never changes anything else in the pack." })]));
}
function punchCard() {
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth(), first = new Date(y, mo, 1).getDay(), days = new Date(y, mo + 1, 0).getDate(), td = now.getDate();
  const key = d => y + "-" + String(mo + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  let hits = 0; for (let d = 1; d <= days; d++) if (meta.days[key(d)]) hits++;
  const s = el("section", { class: "panel", "aria-labelledby": "h-punch" });
  s.appendChild(el("div", { class: "punch-head" }, [el("h2", { id: "h-punch", text: now.toLocaleString([], { month: "long" }) }), el("span", { class: "small", text: plural(hits, "day") + " this month" })]));
  const g = el("div", { class: "punch", role: "img", "aria-label": plural(hits, "day") + " stamped this month" });
  "SMTWTFS".split("").forEach(c => g.appendChild(el("span", { class: "dow", "aria-hidden": "true", text: c })));
  for (let i = 0; i < first; i++) g.appendChild(el("span", { class: "d blank" }));
  for (let d = 1; d <= days; d++) g.appendChild(el("span", { class: "d" + (meta.days[key(d)] ? " hit" : "") + (d === td ? " today" : "") + (d > td ? " future" : ""), text: d }));
  s.appendChild(g);
  s.appendChild(el("p", { class: "punch-foot", text: (meta.total || 0) + " saved so far. One a day gets a stamp; more is extra credit." }));
  return s;
}

/* ---------- Find ----------
   Search matches name, key, group and note. Words like is:todo, is:painted, is:kept, is:pack, is:wip, is:animated narrow it further. */
function legend() { return el("div", { class: "legend" }, ["todo", "wip", "painted", "kept", "pack"].map(k => el("span", {}, [el("i", { class: "dot " + k }), STATUS_TEXT[k]]))); }
function renderFind() {
  dock(null);
  $app.appendChild(top("Find a sprite", true));
  const save = () => history.replaceState({ v: view }, "");
  const q = el("input", { class: "search", type: "search", placeholder: "Search: cup, door, cat, is:animated…", "aria-label": "Search sprites", value: view.q || "" });
  const gs = el("select", { class: "search", "aria-label": "Group" }, [el("option", { value: "", text: "All groups" }), ...GROUPS.map(g => el("option", { value: g, text: g }))]); gs.value = view.group || "";
  const filt = el("div", { class: "chips", role: "group", "aria-label": "Status" }), sizes = el("div", { class: "chips", role: "group", "aria-label": "Size", style: "padding-top:2px" });
  const count = el("p", { class: "small count" }), grid = el("div", { class: "grid" });
  const chip = (wrap, label, on, fn) => wrap.appendChild(el("button", { class: "chip", type: "button", "aria-pressed": on ? "true" : "false", text: label, onclick: fn }));
  const draw = () => {
    filt.innerHTML = ""; sizes.innerHTML = ""; grid.innerHTML = "";
    const pool = SLOTS.filter(s => !view.group || s.group === view.group), n = k => pool.filter(s => k === "done" ? isDone(status(s.key)) : status(s.key) === k).length;
    [["all", "All " + pool.length], ["todo", "To do " + n("todo")], ["wip", "In progress " + n("wip")], ["done", "Done " + n("done")], ["painted", "Painted " + n("painted")], ["kept", "Kept " + n("kept")], ["pack", "In the pack " + n("pack")]]
      .forEach(([k, label]) => chip(filt, label, (view.filter || "all") === k, () => { view.filter = k; save(); draw(); }));
    [["", "Any size"], ["tiny", SIZE_TEXT.tiny], ["small", SIZE_TEXT.small], ["medium", SIZE_TEXT.medium], ["large", SIZE_TEXT.large]]
      .forEach(([k, label]) => chip(sizes, label, (view.size || "") === k, () => { view.size = k; save(); draw(); }));
    const words = (view.q || "").toLowerCase().split(/\s+/).filter(Boolean), is = words.filter(w => w.startsWith("is:")).map(w => w.slice(3)), plain = words.filter(w => !w.startsWith("is:"));
    const f = view.filter || "all";
    const list = pool.filter(s => {
      const st = status(s.key);
      if (f === "done" ? !isDone(st) : f !== "all" && st !== f) return false;
      if (view.size && sizeOf(s) !== view.size) return false;
      for (const w of is) { if (w === "animated" ? framesOf(s) < 2 : w === "progress" ? st !== "wip" : w === "done" ? !isDone(st) : st !== w) return false; }
      const hay = (s.label + " " + s.key + " " + s.key.replace(/_/g, " ") + " " + s.group + " " + (s.note || "")).toLowerCase();
      return plain.every(w => hay.includes(w));
    });
    count.textContent = plural(list.length, "sprite");
    let g = "";
    for (const s of list) {
      if (!view.group && s.group !== g) { g = s.group; grid.appendChild(el("p", { class: "ghead", text: g })); }
      const st = status(s.key), box = el("div", { class: "chk" }, [frameCanvas(inUse(s.key), s, 0, 60)]);
      grid.appendChild(el("button", { class: "sp", type: "button", "aria-label": s.label + ", " + STATUS_TEXT[st], onclick: () => go({ name: "slot", key: s.key }) }, [
        box, el("i", { class: "dot " + st, title: STATUS_TEXT[st] }), el("b", { text: s.label })]));
    }
    if (!list.length) grid.appendChild(el("p", { class: "empty", style: "grid-column:1/-1", text: words.length ? "Nothing matches that." : "Nothing here." }));
  };
  q.addEventListener("input", () => { view.q = q.value; save(); draw(); });
  gs.addEventListener("change", () => { view.group = gs.value; save(); draw(); });
  [q, gs, filt, sizes, legend(), count, grid].forEach(n => $app.appendChild(n));
  draw();
}

/* ---------- One sprite ---------- */
function renderSlot() {
  const s = SLOT[view.key], key = s.key, st = status(key), z = sheetSize(s);
  $app.appendChild(top(s.group, true));
  $app.appendChild(el("p", { class: "who", text: s.label }));
  $app.appendChild(el("div", { class: "tagline" }, [el("span", { class: "tag " + st, text: STATUS_TEXT[st] }), el("span", { class: "tag", text: s.w + "×" + s.h }),
    z.frames > 1 ? el("span", { class: "tag", text: s.layout === "char" ? "walk sheet, 12 frames" : z.frames + " frames" }) : null,
    DB.data.art[key] && DB.data.art[key].origHash !== pixelHash(original(key)) ? el("span", { class: "tag todo", text: "Original updated" }) : null]));
  const differs = st === "painted" || st === "pack";
  $app.appendChild(el("div", { class: "views" + (differs ? "" : " one") }, [
    el("figure", {}, [el("figcaption", { text: "Original" }), animated(original(key), s, 130)]),
    differs ? el("figure", {}, [el("figcaption", { text: st === "painted" ? "Yours" : "In the pack" }), animated(inUse(key), s, 130)]) : null]));
  if (s.note) $app.appendChild(el("div", { class: "brief" }, [el("b", { text: "Notes" }), s.note]));
  $app.appendChild(el("dl", { class: "facts" }, [
    el("dt", { text: "Slot" }), el("dd", { text: key }),
    el("dt", { text: "Sheet" }), el("dd", { text: z.w + "×" + z.h + " px" + (z.frames > 1 ? " (" + z.cols + " × " + z.rows + " frames)" : "") }),
    el("dt", { text: "Group" }), el("dd", { text: s.group })]));
  if (st === "pack") $app.appendChild(el("div", { class: "banner info", text: "This slot already has custom art in the pack, made outside the Paint Room. Painting it here won't replace that art unless you tick it when you export." }));
  $app.appendChild(el("p", { class: "small", text: "The painter comes next (Phase 2). For now you can keep the original, which stamps the day." }));

  const keep = async () => {
    await DB.put("kept", key, { at: new Date().toISOString(), origHash: pixelHash(original(key)) });
    meta.lastGroup = s.group; const first = stamp(); celebrate(s, first);
  };
  const unkeep = async () => { await DB.del("kept", key); toast("Back on the to-do pile"); render(); };
  dock([
    st === "kept" ? el("button", { class: "btn quiet", type: "button", text: "Undo keep", onclick: unkeep })
      : st === "painted" || st === "pack" ? null : el("button", { class: "btn quiet", type: "button", text: "Keep original", onclick: keep }),
    el("button", { class: "btn primary", type: "button", text: "Paint it", disabled: true, title: "Coming in Phase 2" }),
  ]);
}
function celebrate(s, first) {
  const left = SLOTS.filter(x => x.group === s.group && !isDone(status(x.key))).length;
  const sheet = el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "Saved" });
  if (first) {
    sheet.appendChild(el("div", { class: "seal stamp-in", text: "DAY " + new Date().getDate() }));
    sheet.appendChild(el("div", { class: "big", text: "Stamped." }));
    sheet.appendChild(el("p", { text: "That's today's sprite. Anything else is extra credit." }));
  } else {
    sheet.appendChild(el("div", { class: "big", text: "Done." }));
    sheet.appendChild(el("p", { text: left ? plural(left, "sprite") + " left in " + s.group + "." : s.group + " is fully lit. ★" }));
  }
  const close = () => wrap.remove();
  sheet.appendChild(el("div", { class: "acts" }, [
    el("button", { class: "btn quiet", type: "button", text: "Clock out", onclick: () => { close(); go({ name: "home" }); } }),
    el("button", { class: "btn primary", type: "button", text: "One more", onclick: () => { close(); const n = nextSlot(s.key); if (n) go({ name: "slot", key: n.key }, true); else { toast("That's every sprite"); go({ name: "home" }); } } })]));
  const wrap = el("div", { class: "done" }, [sheet]);
  wrap.addEventListener("click", e => { if (e.target === wrap) { close(); go({ name: "home" }); } });
  document.body.appendChild(wrap); sheet.querySelector(".btn.primary").focus();
}

await document.fonts.ready.catch(() => {});
render();
};
</script>
</body>
