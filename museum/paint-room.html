<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Paint Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* The paint room: repaint the museum's sprites one at a time, a little every day. Phone first.
   Art only: it keeps its own art library (IndexedDB) and never writes the curator's draft or anything else in the pack.
   The plan and handoff live in PAINT-ROOM-PLAN.md. */
:root{
  --bg:#f1e4df;--surface:#fffaf7;--surface-2:#f6ebe6;--line:#d9c0b8;--text:#2a171c;--muted:#6d5157;
  --gold:#8f5a0a;--on-gold:#fff8ec;--warn:#a33a22;--ok:#3f7a2a;--shadow:#d9c0b8;--todo:#c0532e;--lit:#f0b840;--dark-room:#3a2a30;
  --wip:#5a7ac0;--pack:#7a5ab0;--check-a:#e8dcd6;--check-b:#f8f0ec;
  --pixel:'Press Start 2P',ui-monospace,monospace;--body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1317;--surface:#281a1f;--surface-2:#34232a;--line:#4b343b;--text:#f3e5d0;--muted:#b59e8c;
  --gold:#e8b24a;--on-gold:#2a1a10;--warn:#f08a6a;--ok:#9fcf7a;--shadow:#0e080a;--todo:#f08a6a;--lit:#f0c050;--dark-room:#120b0e;
  --wip:#8aa8f0;--pack:#b89ae8;--check-a:#2e2025;--check-b:#3a2a30;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1d1317;--surface:#281a1f;--surface-2:#34232a;--line:#4b343b;--text:#f3e5d0;--muted:#b59e8c;
  --gold:#e8b24a;--on-gold:#2a1a10;--warn:#f08a6a;--ok:#9fcf7a;--shadow:#0e080a;--todo:#f08a6a;--lit:#f0c050;--dark-room:#120b0e;
  --wip:#8aa8f0;--pack:#b89ae8;--check-a:#2e2025;--check-b:#3a2a30;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none !important}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 112px)}
.app.nobar{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}

/* Top bar */
.top{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:12px}
.top h1{font-family:var(--pixel);font-weight:400;font-size:13px;line-height:1.5;color:var(--gold);margin:0;flex:1;min-width:0}
.top .crumb{font-size:.85rem;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:2px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:700;padding:0 10px}
.iconbtn:active{transform:translateY(1px)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:48px;padding:.5em 1.1em;border:2px solid var(--text);background:var(--surface);
  border-radius:6px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;font-weight:700;font-size:1rem;text-decoration:none;color:var(--text)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.quiet{border-color:var(--line);box-shadow:none;font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.small{font-size:.85rem;color:var(--muted)}

/* Cards */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px}
.panel h2{font-family:var(--pixel);font-weight:400;font-size:11px;line-height:1.6;margin:0 0 10px;color:var(--text)}
.today{border-color:var(--gold);box-shadow:4px 4px 0 var(--shadow)}
.today .pick{display:flex;gap:14px;align-items:center;margin:0 0 14px}
.today .what{font-weight:700;font-size:1.05rem;line-height:1.35;margin:0 0 2px}
.today .where{font-size:.85rem;color:var(--muted);margin:0}
.today .acts{display:flex;gap:10px}
.today .acts .btn{flex:1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:76px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.tile b{font-size:.98rem;line-height:1.25}
.tile span{font-size:.82rem;color:var(--muted)}
.tile:active{transform:translateY(1px)}

/* A sprite on a checkerboard */
.chk{background-color:var(--check-b);background-image:linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%),linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.today .chk{flex:none;width:84px;height:84px;border:2px solid var(--line)}

/* Punch card */
.punch-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.punch-head h2{margin:0}
.punch{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.punch .dow{font-size:.7rem;color:var(--muted);text-align:center}
.punch .d{aspect-ratio:1;border:2px dashed var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);position:relative}
.punch .d.blank{border:0}
.punch .d.today{border-style:solid;border-color:var(--gold);color:var(--text);font-weight:700}
.punch .d.hit{border:0;background:var(--gold);color:var(--on-gold);font-weight:700}
.punch .d.hit::after{content:"";position:absolute;inset:3px;border:2px solid var(--on-gold);border-radius:50%;opacity:.55}
.punch .d.future{opacity:.4}
.punch-foot{margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.stamp-in{animation:stampin .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampin{0%{transform:scale(2.4) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}

/* Gallery wings: one per group, lighting up as its sprites get done */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.room{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:96px}
.room .win{height:30px;border-radius:4px;background:var(--dark-room);position:relative;overflow:hidden;border:2px solid var(--line)}
.room .win i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--lit),#ffe08a);box-shadow:0 0 14px var(--lit);transition:width .6s}
.room .win.full{box-shadow:0 0 12px var(--lit)}
.room b{font-size:.86rem;line-height:1.25}
.room span{font-size:.76rem;color:var(--muted)}
.room .badge{position:absolute;top:-8px;right:-6px;background:var(--gold);color:var(--on-gold);font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px}
.room:active{transform:translateY(1px)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--lit)}

/* Find */
.search{width:100%;min-height:48px;border:2px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;font-size:16px}
.search:focus{border-color:var(--gold);outline:none}
select.search{appearance:auto;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.count{margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
.sp{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.sp:active{transform:translateY(1px)}
.sp .chk{height:72px}
.sp b{font-size:.78rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.sp .dot{position:absolute;top:6px;right:6px}
.ghead{grid-column:1/-1;margin:10px 0 0;font-weight:700;font-size:.85rem}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);display:inline-block}
.dot.todo{background:var(--todo);border-color:var(--todo)}
.dot.wip{background:var(--wip);border-color:var(--wip)}
.dot.painted{background:var(--lit);border-color:var(--gold)}
.dot.kept{background:var(--surface);border-color:var(--gold)}
.dot.pack{background:var(--pack);border-color:var(--pack)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px}

/* One sprite */
.who{font-weight:700;font-size:1.1rem;line-height:1.35;margin:0 0 4px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tag{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;border:2px solid var(--line);color:var(--muted)}
.tag.todo{border-color:var(--todo);color:var(--todo)}
.tag.painted,.tag.kept{border-color:var(--gold);color:var(--gold)}
.tag.wip{border-color:var(--wip);color:var(--wip)}
.tag.pack{border-color:var(--pack);color:var(--pack)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.views figure{margin:0}
.views figcaption{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 4px}
.views .chk{height:150px;border:2px solid var(--line)}
.views.one{grid-template-columns:1fr}
.brief{background:var(--surface-2);border-left:4px solid var(--gold);border-radius:6px;padding:10px 12px;margin:0 0 14px;font-size:.92rem}
.brief b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem;margin:0 0 14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:700}

/* The bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:2px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px)}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}

/* After a save */
.done{position:fixed;inset:0;z-index:20;background:rgba(20,10,14,.62);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.done .sheet{width:100%;max-width:560px;background:var(--surface);border-radius:16px 16px 0 0;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;animation:rise .28s cubic-bezier(.2,1.2,.4,1) both}
.done .big{font-family:var(--pixel);font-size:18px;line-height:1.5;color:var(--gold);margin:6px 0 6px;display:inline-block}
.done p{margin:0 0 16px;color:var(--muted)}
.done .acts{display:flex;gap:10px}
.done .acts .btn{flex:1}
.seal{width:84px;height:84px;margin:0 auto 6px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:10px;line-height:1.3;position:relative}
.seal::after{content:"";position:absolute;inset:6px;border:3px solid var(--on-gold);border-radius:50%;opacity:.6}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.banner{background:var(--surface-2);border:2px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:.86rem;margin:0 0 14px}
.banner.info{border-color:var(--gold)}
.foot{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.foot .small{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:700;font-size:.85rem;z-index:30;animation:fade .2s both}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
/* The painter */
.pv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.pv .chk{border:2px solid var(--line);padding:6px;min-width:44px;min-height:44px}
.stage{position:relative;width:100%;height:min(calc(100vw - 32px),52vh,528px);height:min(calc(100vw - 32px),52svh,528px);border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.zoom{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin:8px 0 0}
.framelabel{margin:8px 0 0;line-height:1.3}
.zoom button{min-width:44px;min-height:44px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;padding:0 8px}
.zoom button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.frames{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.frames button{flex:none;display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:4px;border:2px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.frames button[aria-current="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.framebar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.framebar .btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.tool span{line-height:1.15;text-align:center}
.selbar{align-items:center;margin:0 0 10px}
.trace .range,.colors .range{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:10px;margin:8px 0;font-size:.85rem;font-weight:700}
.trace input[type=range],.colors input[type=range]{width:100%;accent-color:var(--gold)}
.colors input[type=range]{-webkit-appearance:none;appearance:none;height:22px;border-radius:999px;border:2px solid var(--line)}
.colors input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #222;box-shadow:0 0 0 1px #fff}
.colors input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #222}
.colors input.hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.done .sheet.colors{text-align:left}
.cmprow{display:flex;gap:10px;align-items:center;margin:8px 0}
.sw.cmp{width:72px;height:44px;cursor:default;display:flex}
.sw.cmp i{position:static;flex:1}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:10px 0}
.check input{width:22px;height:22px;accent-color:var(--gold)}
.reorder{display:flex;gap:6px}
.reorder .btn{text-transform:none;letter-spacing:0}
.sw.big{cursor:pointer}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border:2px solid var(--line);border-radius:8px;background:var(--surface);font-size:.75rem;font-weight:700;cursor:pointer;padding:6px 2px}
.tool svg{width:24px;height:24px}
.tool[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.cur{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.palsep{flex-basis:100%;height:0}
.sw{position:relative;width:40px;height:40px;border-radius:6px;border:2px solid var(--line);padding:0;cursor:pointer;overflow:hidden;flex:none;
  background-color:var(--check-b);background-image:linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%),linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.sw i{position:absolute;inset:0}
.sw.big{width:48px;height:48px;cursor:default}
.sw[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:2px}
.sw.add{background:var(--surface);border-style:dashed;font-weight:700;font-size:1.3rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
details.more summary{cursor:pointer;font-weight:700;min-height:28px}
details.more .foot{margin-top:12px}
.iconbtn[disabled]{opacity:.35;pointer-events:none}
.ctxbox{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.ctxhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctxhead b{font-size:.85rem}
.ctxhead .small{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxview{margin-top:8px;display:flex;justify-content:center;background:#000;border-radius:6px;overflow:hidden}
.ctxview .small{color:#cbb;padding:12px;text-align:center}
.btn.small{min-height:36px;padding:.2em .8em;font-size:.85rem}
.palhead{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 0 6px}
.palhead.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.palhead.row .btn{text-transform:none;letter-spacing:0}
.pal.mine{gap:8px}
.swcell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:52px}
.swname{font-size:.66rem;line-height:1.2;color:var(--muted);max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swdel{position:absolute;top:-8px;right:-4px;width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);background:var(--warn);color:#fff;font-weight:700;line-height:1;cursor:pointer;padding:0}
.mine.editing .sw{animation:wob .9s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<main class="app" id="app"><p class="empty">Opening the paint room…</p></main>
<div class="dock" id="dock" hidden><div class="in" id="dockIn"></div></div>

<script>
/* Load the engine for its sprite slots and built-in art (version from version.json, so this page never needs a version bump). */
(function () {
  const go = v => { const s = document.createElement("script"); s.src = "museum-engine.js" + (v ? "?v=" + encodeURIComponent(v) : ""); s.onload = () => window.prStart(); s.onerror = () => { document.getElementById("app").innerHTML = '<p class="empty">Couldn\'t load museum-engine.js. Open this page from the museum folder.</p>'; }; document.head.appendChild(s); };
  if (/^https?:$/.test(location.protocol)) fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(r => (r.ok ? r.json() : {})).then(j => go(j.version), () => go(""));
  else go("");
})();
</script>
<script>
window.prStart = async function () {
"use strict";
const META_KEY = "goq-paint-room", SITE_PACK = "museum-pack.json";
const $app = document.getElementById("app"), $dock = document.getElementById("dock"), $dockIn = document.getElementById("dockIn");
const el = (tag, attrs, kids) => { const e = document.createElement(tag); for (const k in attrs || {}) { const v = attrs[k]; if (v == null || v === false) continue; if (k === "text") e.textContent = v; else if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v); } (kids || []).forEach(c => c != null && e.appendChild(typeof c === "string" ? document.createTextNode(c) : c)); return e; };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

/* ---------- Picking today's sprite ----------
