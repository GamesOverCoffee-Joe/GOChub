<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curator: GOQ Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Matches the Theater's Asset Studio. */
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1e4df;--surface:#fffaf7;--surface-2:#f6ebe6;--line:#d9c0b8;--text:#2a171c;--muted:#6d5157;
  --gold:#8f5a0a;--on-gold:#fff8ec;--warn:#a33a22;--ok:#3f7a2a;--shadow:#d9c0b8;--stage:#1d1317;
  --pixel:'Press Start 2P',ui-monospace,monospace;--body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1317;--surface:#281a1f;--surface-2:#34232a;--line:#4b343b;--text:#f3e5d0;--muted:#b59e8c;
  --gold:#e8b24a;--on-gold:#2a1a10;--warn:#f08a6a;--ok:#9fcf7a;--shadow:#0e080a;--stage:#120b0e;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1d1317;--surface:#281a1f;--surface-2:#34232a;--line:#4b343b;--text:#f3e5d0;--muted:#b59e8c;
  --gold:#e8b24a;--on-gold:#2a1a10;--warn:#f08a6a;--ok:#9fcf7a;--shadow:#0e080a;--stage:#120b0e;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:40px;padding:.45em .95em;border:2px solid var(--text);
  background:var(--surface);color:var(--text);border-radius:3px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;font-weight:700;font-size:.92rem;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.quiet{border-color:var(--line);box-shadow:none;font-weight:600}
.btn.small{min-height:34px;font-size:.82rem;padding:.3em .7em}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Touch controls for the preview */
.gt-controls{display:none;justify-content:space-between;align-items:center;gap:24px;padding:4px 6px;max-width:420px;margin:0 auto;width:100%;touch-action:none;user-select:none;-webkit-user-select:none;
  --surface-2:#34232a;--text:#b59e8c;--gold:#e8b24a;--on-gold:#2a1a10;--shadow:#0a0507;color:#f3e5d0}
@media (pointer:coarse){.gt-controls{display:flex}}
.gt-pad{position:relative;width:138px;height:138px;touch-action:none;flex:none}
.gt-pad span,.gt-pad i{position:absolute;background:var(--surface-2);border:2px solid var(--text)}
.gt-pad .u,.gt-pad .d{left:46px;width:46px;height:48px}
.gt-pad .u{top:0;border-bottom:0;border-radius:4px 4px 0 0}.gt-pad .d{bottom:0;border-top:0;border-radius:0 0 4px 4px}
.gt-pad .l,.gt-pad .r{top:46px;height:46px;width:48px}
.gt-pad .l{left:0;border-right:0;border-radius:4px 0 0 4px}.gt-pad .r{right:0;border-left:0;border-radius:0 4px 4px 0}
.gt-pad i{left:46px;top:46px;width:46px;height:46px;border:0;background:var(--surface-2)}
.gt-pad[data-dir="up"] .u,.gt-pad[data-dir="down"] .d,.gt-pad[data-dir="left"] .l,.gt-pad[data-dir="right"] .r{background:var(--gold)}
.gt-btns{display:flex;gap:16px;align-items:center;transform:rotate(-18deg)}
.gt-btn{-webkit-tap-highlight-color:transparent;outline:none;touch-action:none;width:62px;height:62px;border-radius:50%;border:2px solid var(--text);background:var(--surface-2);color:#f3e5d0;font-family:var(--pixel);font-size:14px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.gt-btn-a{color:var(--gold);margin-top:-26px}
.gt-start{align-self:flex-end;font-family:var(--pixel);font-size:8px;padding:6px 10px;border-radius:12px;border:2px solid var(--text);background:var(--surface-2);color:var(--text);transform:rotate(-18deg);touch-action:none}
.gt-start.down{background:var(--gold);color:var(--on-gold)}
.gt-btn.down{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow);background:var(--gold);color:var(--on-gold)}

/* Game screen (same as museum.html) */
.gt-wrap{--s:2;position:relative;width:calc(240px * var(--s));height:calc(160px * var(--s));background:#000;overflow:hidden;
  font-family:var(--pixel);user-select:none;-webkit-user-select:none;touch-action:none;outline:none;-webkit-tap-highlight-color:transparent}
.gt-wrap canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.gt-box{position:absolute;box-sizing:border-box;border-style:solid;border-width:calc(8px * var(--s));border-image-slice:8 fill;border-image-repeat:stretch;
  background:#f8f8f0;background-clip:padding-box;color:#181820;font-size:calc(8px * var(--s));line-height:calc(16px * var(--s));display:none;image-rendering:pixelated}
.gt-text{left:0;right:0;bottom:0;height:calc(48px * var(--s));padding:0 calc(2px * var(--s));cursor:pointer;z-index:5}
.gt-text-body{white-space:pre-wrap;overflow:hidden;height:100%;overflow-wrap:anywhere}
.gt-more{position:absolute;right:calc(2px * var(--s));bottom:calc(1px * var(--s));width:0;height:0;border-left:calc(3px * var(--s)) solid transparent;
  border-right:calc(3px * var(--s)) solid transparent;border-top:calc(4px * var(--s)) solid #181820;display:none;animation:gtblink .6s steps(1) infinite}
@keyframes gtblink{50%{opacity:0}}
.gt-loc{position:absolute;left:calc(4px * var(--s));top:calc(4px * var(--s));padding:calc(5px * var(--s)) calc(8px * var(--s));background:#181820;color:#f8f8f0;
  font-size:calc(8px * var(--s));line-height:1.4;border:calc(1px * var(--s)) solid #f8f8f0;opacity:0;transform:translateY(-120%);
  transition:transform .25s steps(4),opacity .25s steps(4);pointer-events:none;max-width:70%;z-index:6}
.gt-loc.on{opacity:1;transform:none}
.gt-closeup{position:absolute;left:0;right:0;top:0;height:calc(112px * var(--s));display:none;align-items:center;justify-content:center;background:rgba(24,24,32,.82);cursor:pointer;z-index:4}
.gt-cu-frame{box-sizing:border-box;width:calc(112px * var(--s));border-style:solid;border-width:calc(8px * var(--s));border-image-slice:8;border-image-repeat:stretch;background:#000;image-rendering:pixelated}
.gt-cu-frame img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges}
.gt-cu-frame img.photo{image-rendering:auto}
.gt-cu-links{position:absolute;right:calc(4px * var(--s));bottom:calc(3px * var(--s));display:flex;gap:calc(4px * var(--s));z-index:2}
.gt-cu-links a{font-family:var(--pixel);font-size:calc(6px * var(--s));line-height:1;padding:calc(3px * var(--s)) calc(4px * var(--s));background:#181820;color:#f8f8f0;
  border:calc(1px * var(--s)) solid #f8f8f0;text-decoration:none}
.gt-cu-links a:hover,.gt-cu-links a:focus-visible{background:#e8b24a;color:#181820;outline:none}
@media (prefers-reduced-motion: reduce){.gt-more{animation:none}.gt-loc{transition:none}}

/* Layout */
.app{display:grid;grid-template-columns:250px minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar bar bar" "slots main preview";height:100%}
.app.no-side{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"bar bar" "main preview"}
.app.no-side .slots{display:none}
.bar{grid-area:bar;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 18px;border-bottom:2px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column;gap:4px;margin-right:auto}
.brand b{font-family:var(--pixel);font-size:13px;font-weight:400;color:var(--gold);line-height:1.4}
.brand span{font-size:.82rem;color:var(--muted)}
.tabs{display:flex;border:2px solid var(--text);border-radius:3px;overflow:hidden}
.tabs button{border:0;background:var(--surface);padding:.45em 1.1em;cursor:pointer;font-weight:700;min-height:38px}
.tabs button+button{border-left:2px solid var(--text)}
.tabs button[aria-selected="true"]{background:var(--text);color:var(--surface)}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#saved{font-size:.84rem;color:var(--muted);max-width:32ch}
#saved.err{color:var(--warn)}

.slots{grid-area:slots;overflow:auto;border-right:2px solid var(--line);padding:10px 8px 24px;background:var(--surface-2)}
.slots h3{font-size:.78rem;color:var(--muted);margin:16px 8px 6px;font-weight:700}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid transparent;background:none;border-radius:3px;padding:5px 8px;cursor:pointer;font-size:.9rem;line-height:1.25}
.slot:hover{background:var(--surface)}
.slot[aria-current="true"]{border-color:var(--text);background:var(--surface);box-shadow:3px 3px 0 var(--shadow)}
.slot canvas{width:40px;height:40px;flex:none;image-rendering:pixelated;background:var(--bg);border-radius:2px;object-fit:contain}
.slot .nm{flex:1}
.slot .tag{font-size:.7rem;font-weight:700;color:var(--ok);border:1.5px solid currentColor;border-radius:2px;padding:0 .35em}
.slot.atlas{border-color:var(--line);margin-bottom:4px}

main{grid-area:main;overflow:auto;padding:22px 28px 40px;min-width:0}
.editor{max-width:760px}
h2.title{font-family:var(--pixel);font-weight:400;font-size:16px;line-height:1.5;margin:0 0 10px}
.spec{margin:0;font-weight:700}
.note{margin:4px 0 0;color:var(--muted);max-width:66ch}
.views{display:flex;gap:18px;flex-wrap:wrap;margin:20px 0}
.view{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.view figcaption{font-size:.84rem;color:var(--muted);font-weight:700}
.view canvas{image-rendering:pixelated;display:block;max-width:100%;border:2px solid var(--line);border-radius:2px;background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface) 0 50%) 0 0/16px 16px}
.drop{border:2px dashed var(--line);border-radius:4px;padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface)}
.drop.over{border-color:var(--gold);background:var(--surface-2)}
.drop p{margin:0;flex:1;min-width:200px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.msg{margin:14px 0 0;min-height:1.5em;font-size:.92rem}
.msg.ok{color:var(--ok)}.msg.err{color:var(--warn)}
ol.steps{margin:14px 0 0;padding-left:1.4em;max-width:66ch}
ol.steps li{margin:4px 0}
.atlas-view{margin-top:20px;position:relative;display:inline-block;max-width:100%;overflow:auto;border:2px solid var(--line);border-radius:2px;
  background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface) 0 50%) 0 0/16px 16px}
.atlas-view canvas{display:block;image-rendering:pixelated}
.atlas-view canvas+canvas{position:absolute;left:0;top:0}
label.check{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;margin-top:12px}

.pieces{max-width:920px}
.pieces>p{color:var(--muted);max-width:66ch;margin:0 0 8px}
.prow{display:grid;grid-template-columns:168px minmax(0,1fr);gap:16px;padding:14px;border:2px solid var(--line);border-radius:4px;background:var(--surface);margin-top:12px}
.prow .th{width:168px;aspect-ratio:4/3;object-fit:cover;border-radius:2px;background:#000;display:block;image-rendering:pixelated}
.prow .th.photo{image-rendering:auto}
.prow .frame{border:4px solid #c89a2c;border-radius:2px}
.prow.community .frame{border-color:#8a5a34}
.spotlbl{font-family:var(--pixel);font-size:9px;line-height:1.6;color:var(--gold);margin-top:8px;display:block}
.spotlbl.off{color:var(--muted)}
.side-acts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;font-weight:700;color:var(--muted)}
.fields .wide{grid-column:1/-1}
.fields small{font-weight:400}
input[type=text],input[type=url],input[type=date],select,textarea{border:2px solid var(--line);background:var(--surface);border-radius:3px;padding:.45em .6em;min-height:40px;width:100%;font-weight:400;color:var(--text);font-size:.95rem}
textarea{min-height:72px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.fieldset{display:flex;flex-direction:column;gap:3px}
.fieldset .flabel{font-size:.8rem;font-weight:700;color:var(--muted)}
.fieldset small{font-size:.8rem;color:var(--muted)}
.unveil{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px}
.unveil label.check{margin:0;font-weight:600;color:var(--text)}
.unveil input[type=date]{width:auto;flex:1;min-width:150px}
input:invalid{border-color:var(--warn)}
fieldset.lightroom{border:2px solid var(--line);border-radius:4px;background:var(--surface);padding:12px 16px 16px;margin:18px 0 0;display:grid;gap:10px;max-width:560px}
fieldset.lightroom legend{font-weight:700;padding:0 6px}
fieldset.lightroom .btn{justify-self:start}
label.range{display:grid;grid-template-columns:170px 1fr 48px;align-items:center;gap:12px;font-size:.9rem;font-weight:600}
label.range output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
input[type=range]{accent-color:var(--gold);width:100%}
.guestbook{margin-top:36px;padding-top:20px;border-top:2px solid var(--line)}
.guestbook textarea{min-height:140px;font-family:var(--body)}
.empty{padding:20px;border:2px dashed var(--line);border-radius:4px;color:var(--muted);margin-top:12px}

.preview{grid-area:preview;border-left:2px solid var(--line);padding:18px;overflow:auto;background:var(--stage);color:#f3e5d0;display:flex;flex-direction:column;gap:12px;align-items:center}
.preview h2{font-family:var(--pixel);font-size:11px;font-weight:400;margin:0;color:#e8b24a;align-self:flex-start}
#stage{box-shadow:0 0 0 3px #34232a,0 0 0 5px #4b343b}
#stage:focus-visible{outline:3px solid #e8b24a;outline-offset:6px}
.jump{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.preview .btn{--surface:#281a1f;--surface-2:#34232a;--text:#f3e5d0;--line:#4b343b;--shadow:#0a0507;min-height:34px;font-size:.82rem;padding:.3em .7em}
.pv-hint{font-size:.84rem;color:#b59e8c;text-align:center;max-width:44ch;margin:0}
@media (pointer:coarse){.pv-hint{display:none}}
@media (max-width:980px){
  .app,.app.no-side{display:block;height:auto}
  .slots{max-height:260px;border-right:0;border-bottom:2px solid var(--line)}
  .preview{border-left:0;border-top:2px solid var(--line)}
}

/* Rooms: the level editor */
.rooms{max-width:1100px}
.rhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.rhead select{font:inherit;color:var(--text);background:var(--surface);border:2px solid var(--line);border-radius:3px;padding:6px 8px;min-height:40px}
.rtools{display:flex;gap:6px;flex-wrap:wrap}
.btn.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.rpal{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;align-items:center;-webkit-overflow-scrolling:touch}
.rpal-t{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap;padding-right:4px}
.rchip{display:flex;align-items:center;gap:6px;flex:none;border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:4px;padding:3px 8px 3px 3px;font:inherit;font-size:.82rem;cursor:pointer;min-height:44px}
.rchip.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.rchip canvas{width:32px;height:32px;image-rendering:pixelated;background:var(--surface-2);border-radius:2px}
.rcanvas{position:relative;height:min(62vh,560px);min-height:300px;border:2px solid var(--line);border-radius:4px;overflow:hidden;background:#120b0e;touch-action:none}
.rcanvas canvas{display:block;touch-action:none;cursor:crosshair}
.rhint{margin:8px 0 0}
.rinsp{margin-top:14px;padding:14px;border:2px solid var(--line);border-radius:4px;background:var(--surface)}
.rinsp h3{margin:0 0 10px;font-size:1rem}
.rfield{display:flex;flex-direction:column;gap:3px;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:10px;flex:1;min-width:140px}
.rfield small{font-weight:400}
.rfield textarea{min-height:80px}
.rfield input,.rfield select{font:inherit;font-weight:400;color:var(--text);background:var(--surface);border:2px solid var(--line);border-radius:3px;padding:6px 8px;min-height:40px}
.rrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.rissues{margin:8px 0;padding-left:1.2em;color:var(--warn);font-size:.9rem}

.rpick{margin:2px 0 8px}
.rpick .rchip{min-height:48px}
.rchg{margin-left:6px;font-size:.78rem;color:var(--gold)}
dialog.rchooser{border:2px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);padding:14px 16px 18px;width:min(720px,calc(100vw - 20px));max-height:calc(100dvh - 30px);overflow:auto}
dialog.rchooser::backdrop{background:rgba(10,5,7,.6)}
.rch-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--surface);padding:4px 0 6px;z-index:1}
.rch-head h3{margin:0}
dialog.rchooser h4{margin:12px 0 6px;font-size:.8rem;color:var(--muted)}
.rch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rch-grid .rchip{width:100%}
.rbody{display:block}
.rleft{min-width:0}
.rcanvas{overscroll-behavior:contain}
.rzoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.rzoom .btn{min-width:40px;min-height:40px;font-size:1.1rem;padding:0;box-shadow:none}
/* Map and inspector side by side whenever the editor column is wide enough (a container query, so the preview's width counts). */
.rooms{container-type:inline-size}
@container (min-width:760px){
  .rbody{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
  .rcanvas{height:calc(100vh - 250px);min-height:380px}
  .rinsp{margin-top:0;max-height:calc(100vh - 210px);overflow:auto}
}
@media (min-width:981px){.preview{width:min(520px,38vw)}}
#pvJump{display:none}
@media (max-width:980px){#pvJump{display:inline-flex}.tabs{overflow-x:auto;max-width:100%}.bar{gap:10px}}
@media (pointer:coarse){.rtools .btn{min-height:44px}}
@media (max-width:620px){.prow{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand"><b>Curator</b><span>GOQ Museum: art, pieces, and the museum pack</span></div>
    <div class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-art" aria-selected="true" aria-controls="main">Art</button>
      <button role="tab" id="tab-pieces" aria-selected="false" aria-controls="main">Pieces</button>
      <button role="tab" id="tab-staff" aria-selected="false" aria-controls="main">Staff</button>
      <button role="tab" id="tab-shop" aria-selected="false" aria-controls="main">Shop</button>
      <button role="tab" id="tab-rooms" aria-selected="false" aria-controls="main">Rooms</button>
    </div>
    <div class="actions">
      <span id="saved" role="status"></span>
      <label class="btn quiet" for="importFile">Import pack</label>
      <input id="importFile" class="sr-only" type="file" accept=".json,application/json">
      <button class="btn primary" id="exportBtn" type="button">Export pack</button>
      <button class="btn quiet" id="pvJump" type="button">Preview</button>
    </div>
  </header>
  <nav class="slots" id="slots" aria-label="Art slots"></nav>
  <main id="main"></main>
  <aside class="preview" aria-label="Live preview">
    <h2>Live preview</h2>
    <div id="stage" aria-label="Museum preview. Click it, then walk with arrow keys or WASD, Z or Space to interact, X to go back."></div>
    <div id="controls"></div>
    <div class="jump">
      <button class="btn" type="button" data-go="lobby">Lobby</button>
      <button class="btn" type="button" data-go="gallery">Gallery</button>
      <button class="btn" type="button" id="who" aria-pressed="true">Viewing as curator</button>
      <button class="btn" type="button" id="recrate" title="Put pieces with a future unveil date back in their crates">Repack crates</button>
      <button class="btn" type="button" id="spooky" aria-pressed="false" title="How often something creepy happens after the lights go out">Spooky: rare</button>
      <button class="btn" type="button" id="timeBtn" title="Pin the time of day in the preview, or follow the clock">Time: clock</button>
      <button class="btn" type="button" id="rechore" title="Dust settles, plants get thirsty, the mug goes missing, visitors come back, lights come on">Reset chores</button>
    </div>

  </aside>
</div>
<script src="museum-engine.js"></script>
<script>
(function () {
"use strict";
const DRAFT_KEY = "goq-curator-draft", SITE_PACK = "museum-pack.json", MAX_PIECE_W = 480;
const $ = s => document.querySelector(s);
const el = (tag, attrs, kids) => {
  const e = document.createElement(tag);
  for (const k in attrs || {}) { const v = attrs[k]; if (k === "text") e.textContent = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v); }
  (kids || []).forEach(c => c && e.appendChild(c)); return e;
};
const uid = () => "piece-" + Math.random().toString(36).slice(2, 9);
const savedEl = $("#saved");
function status(text, err) { savedEl.textContent = text; savedEl.className = err ? "err" : ""; }

/* ---------- Draft: the pack being edited ---------- */
let draft = { assets: {}, pieces: [], guestbook: [], settings: { lighting: {} } };
function packOut() {
  return { format: GOQ.PACK_FORMAT, version: 1, assets: draft.assets, settings: draft.settings, guestbook: draft.guestbook, rooms: draft.rooms || {}, pieces: draft.pieces.map(p => {
    const o = { id: p.id, kind: p.kind, title: p.title, developer: p.developer };
    if (p.kind === "episode") { o.observation = p.observation; o.intention = p.intention; }
    else { o.guestWriter = p.guestWriter; o.guestNote = p.guestNote; }
    if (p.episodeUrl) o.episodeUrl = p.episodeUrl;
    if (p.gameUrl) o.gameUrl = p.gameUrl;
    if (p.hint) o.hint = p.hint;
    if (p.unveil) o.unveil = p.unveil;
    if (p.image) o.image = p.image; else { o.colors = p.colors; o.style = p.style; }
    return o;
  }) };
}
function useDraft(raw) {
  const n = GOQ.normalizePack(raw);
  draft = { assets: n.assets, pieces: n.pieces, guestbook: n.guestbook, settings: n.settings, rooms: JSON.parse(JSON.stringify(n.rooms || {})) };
}
let saveT = 0;
function changed(opts) {
  opts = opts || {};
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(packOut())); status("Saved in this browser"); }
    catch (e) { status("Too large to save in the browser. Export the pack to keep your changes.", true); }
    refreshPreview();
  }, opts.now ? 0 : 400);
}

/* ---------- Live preview ---------- */
const stage = $("#stage");
const game = new GOQ.Game(stage, undefined, { curator: true, capture: "focus", saveKey: null, showTestBadge: true });
GOQ.mountControls(game, $("#controls"));
game.tapWalk = matchMedia("(pointer:coarse)").matches; // tap to walk in the preview on touch screens
window.goqCurator = { game, get draft() { return draft; } };
async function refreshPreview() {
  await game.setPack(packOut());
  if (tab === "art") renderSlotList();
}
function fitPreview() {
  const w = window.innerWidth;
  game.fit(w > 1400 ? 480 : w > 980 ? 360 : Math.min(480, w - 60), 400);
}
window.addEventListener("resize", fitPreview); fitPreview();
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { game.teleport(b.dataset.go); stage.focus({ preventScroll: true }); }));
$("#who").addEventListener("click", e => {
  const on = !game.curator; game.setCurator(on);
  e.currentTarget.textContent = on ? "Viewing as curator" : "Viewing as a visitor"; e.currentTarget.setAttribute("aria-pressed", on);
  stage.focus({ preventScroll: true });
});
$("#recrate").addEventListener("click", () => { game.resetHangs(); stage.focus({ preventScroll: true }); });
$("#rechore").addEventListener("click", () => { game.resetProgress(); stage.focus({ preventScroll: true }); });
// Time: follow the real clock, or pin day, sunset or night to see (and record) the evening details.
$("#timeBtn").addEventListener("click", e => {
  const order = [null, "day", "sunset", "night"], next = order[(order.indexOf(game.timeOverride) + 1) % order.length];
  game.setTime(next); e.currentTarget.textContent = "Time: " + (next || "clock"); stage.focus({ preventScroll: true });
});
// Spooky: "always" makes the rare creepy moment happen on every closing, handy for recording an end-card.
$("#spooky").addEventListener("click", e => {
  game.forceSpook = !game.forceSpook; game.spook = null;
  e.currentTarget.textContent = game.forceSpook ? "Spooky: always" : "Spooky: rare"; e.currentTarget.setAttribute("aria-pressed", game.forceSpook);
  stage.focus({ preventScroll: true });
});
// "Reset chores" also reopens the museum: visitors come back and the lights come on.

/* ---------- Tabs ---------- */
let tab = "art", current = "atlas";
function setTab(t) {
  tab = t;
  ["art", "pieces", "staff", "shop", "rooms"].forEach(k => $("#tab-" + k).setAttribute("aria-selected", t === k));
  $("#app").classList.toggle("no-side", t !== "art");
  render();
}
$("#tab-art").addEventListener("click", () => setTab("art"));
$("#tab-pieces").addEventListener("click", () => setTab("pieces"));
$("#tab-staff").addEventListener("click", () => setTab("staff"));
$("#tab-shop").addEventListener("click", () => setTab("shop"));
$("#tab-rooms").addEventListener("click", () => setTab("rooms"));
// Small screens: the preview sits below the editor; this jumps to it.
$("#pvJump").addEventListener("click", () => document.querySelector(".preview").scrollIntoView({ behavior: "smooth", block: "start" }));
function render() { if (tab === "art") { renderSlotList(); renderSlot(); } else if (tab === "staff") renderStaff(); else if (tab === "shop") renderShop(); else if (tab === "rooms") renderRooms(); else renderPieces(); }

/* ---------- Image helpers ---------- */
function readFile(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error("That file couldn't be read.")); r.readAsDataURL(file); }); }
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That file isn't an image this browser can open.")); i.src = src; }); }
function canvasOf(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; return [c, x]; }
function download(name, blobOrUrl) {
  const url = typeof blobOrUrl === "string" ? blobOrUrl : URL.createObjectURL(blobOrUrl);
  const a = el("a", { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
  if (typeof blobOrUrl !== "string") setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function sheetSize(key) { const s = GOQ.SLOT[key], g = GOQ.sheetGrid(s); return { w: s.w * g.cols, h: s.h * g.rows }; }
/* The slot's art as a canvas at exactly its sheet size (custom art is clipped if oversized). */
function slotCanvas(key) {
  const { w, h } = sheetSize(key), [c, x] = canvasOf(w, h); x.drawImage(game.sheet(key), 0, 0, w, h, 0, 0, w, h); return c;
}
function pixelsMatch(a, b, tol) {
  for (let i = 0; i < a.length; i += 4) {
    if (a[i + 3] < 8 && b[i + 3] < 8) continue;
    if (Math.abs(a[i] - b[i]) > tol || Math.abs(a[i + 1] - b[i + 1]) > tol || Math.abs(a[i + 2] - b[i + 2]) > tol || Math.abs(a[i + 3] - b[i + 3]) > tol) return false;
  }
  return true;
}
const dataOf = c => c.getContext("2d").getImageData(0, 0, c.width, c.height).data;

/* ---------- Slot list ---------- */
function renderSlotList() {
  const nav = $("#slots"); nav.innerHTML = "";
  const thumb = (src, w, h) => { const s = Math.max(w, h), [c, x] = canvasOf(s, s); x.drawImage(src, 0, 0, w, h, (s - w) / 2, (s - h) / 2, w, h); return c; };
  const atl = el("button", { class: "slot atlas", type: "button", "aria-current": current === "atlas" ? "true" : "false", onclick: () => { current = "atlas"; render(); } });
  const [ac, ax] = canvasOf(40, 40); ax.fillStyle = "#8f5a0a"; [[4, 4], [20, 4], [4, 20], [20, 20]].forEach(([x, y]) => ax.fillRect(x, y, 14, 14)); atl.appendChild(ac);
  atl.appendChild(el("span", { class: "nm", text: "Photoshop atlas" })); nav.appendChild(atl);
  const lit = el("button", { class: "slot atlas", type: "button", "aria-current": current === "lighting" ? "true" : "false", onclick: () => { current = "lighting"; render(); } });
  const [lc, lx] = canvasOf(40, 40); lx.fillStyle = "#1a1430"; lx.fillRect(0, 0, 40, 40);
  const lg = lx.createRadialGradient(20, 18, 2, 20, 18, 16); lg.addColorStop(0, "#ffd890"); lg.addColorStop(1, "rgba(255,216,144,0)"); lx.fillStyle = lg; lx.fillRect(0, 0, 40, 40);
  lc.style.imageRendering = "auto"; lit.appendChild(lc); lit.appendChild(el("span", { class: "nm", text: "Lighting" })); nav.appendChild(lit);
  let group = "";
  for (const s of GOQ.SLOTS) {
    if (s.retired) continue; // kept in the list only so older atlases line up
    if (s.group !== group) { group = s.group; nav.appendChild(el("h3", { text: group })); }
    const b = el("button", { class: "slot", type: "button", "aria-current": current === s.key ? "true" : "false", onclick: () => { current = s.key; render(); } });
    b.appendChild(thumb(game.sheet(s.key), s.w, s.h));
    b.appendChild(el("span", { class: "nm", text: s.label }));
    if (draft.assets[s.key]) b.appendChild(el("span", { class: "tag", text: "Custom" }));
    nav.appendChild(b);
  }
}

/* ---------- One slot ---------- */
function renderSlot() {
  const main = $("#main"); main.innerHTML = "";
  if (current === "atlas") return renderAtlas();
  if (current === "lighting") return renderLighting();
  const s = GOQ.SLOT[current], { w, h } = sheetSize(current), custom = !!draft.assets[current];
  const ed = el("section", { class: "editor" }); main.appendChild(ed);
  ed.appendChild(el("h2", { class: "title", text: s.label }));
  const frames = s.layout === "char" ? "3 × 4 frames of " + s.w + "×" + s.h : s.frames > 1 ? s.frames + " frames of " + s.w + "×" + s.h : "";
  ed.appendChild(el("p", { class: "spec", text: w + "×" + h + " pixels" + (frames ? ", " + frames : "") + ". PNG with transparency." }));
  if (s.note) ed.appendChild(el("p", { class: "note", text: s.note }));
  const scale = Math.max(2, Math.min(8, Math.floor(256 / Math.max(w, h))));
  const big = src => { const [c, x] = canvasOf(w * scale, h * scale); x.drawImage(src, 0, 0, w, h, 0, 0, w * scale, h * scale); return c; };
  ed.appendChild(el("div", { class: "views" }, [
    el("figure", { class: "view" }, [el("figcaption", { text: "Built-in" }), big(GOQ.placeholder(current))]),
    el("figure", { class: "view" }, [el("figcaption", { text: custom ? "Yours" : "In use (built-in)" }), big(game.sheet(current))]),
  ]));
  const msg = el("p", { class: "msg", role: "status" });
  const input = el("input", { type: "file", accept: "image/png,image/gif,image/webp", class: "sr-only", id: "slotFile" });
  const take = async file => {
    try {
      const src = await readFile(file), img = await loadImg(src);
      let out = src;
      if (img.width !== w || img.height !== h) {
        const k = img.width / w;
        if (Number.isInteger(k) && k > 1 && img.height === h * k) { const [c, x] = canvasOf(w, h); x.drawImage(img, 0, 0, w, h); out = c.toDataURL("image/png"); }
        else throw new Error("This slot needs a " + w + "×" + h + " image. That one is " + img.width + "×" + img.height + ".");
      }
      draft.assets[current] = { src: out }; changed({ now: true });
      await game.setPack(packOut()); render();
      $(".msg").className = "msg ok"; $(".msg").textContent = "Updated. The preview is using your art.";
    } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
  };
  input.addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) take(f); });
  const drop = el("div", { class: "drop" }, [
    el("p", { text: "Drop a PNG here, or choose one. A clean 2×, 3× or 4× upscale is shrunk back to size." }),
    el("label", { class: "btn", for: "slotFile", text: "Choose image" }), input,
  ]);
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) take(f); });
  ed.appendChild(drop);
  ed.appendChild(el("div", { class: "row" }, [
    el("button", { class: "btn quiet", type: "button", text: "Download as template", onclick: () => slotCanvas(current).toBlob(b => download(current + ".png", b)) }),
    custom ? el("button", { class: "btn quiet", type: "button", text: "Use built-in art", onclick: async () => { delete draft.assets[current]; changed({ now: true }); await game.setPack(packOut()); render(); } }) : null,
  ]));
  ed.appendChild(msg);
}

/* ---------- Photoshop atlas ----------
   Every slot on one sheet, at fixed positions. Slots are placed in SLOTS order in rows,
   each with a label band above it (empty in the atlas, labeled in the guide). */
const ATLAS_W = 352, CELL_MIN = 84, BAND = 9, GAP = 6;
function atlasLayout() {
  const pos = {}; let x = GAP, y = GAP, rowH = 0;
  for (const s of GOQ.SLOTS) {
    const { w, h } = sheetSize(s.key), cw = Math.max(CELL_MIN, w);
    if (x + cw > ATLAS_W - GAP) { x = GAP; y += rowH + GAP; rowH = 0; }
    pos[s.key] = { x, y: y + BAND, w, h };
    x += cw + GAP; rowH = Math.max(rowH, BAND + h);
  }
  return { pos, w: ATLAS_W, h: y + rowH + GAP };
}
const FONT = {
  A: ["010","101","111","101","101"], B: ["110","101","110","101","110"], C: ["011","100","100","100","011"], D: ["110","101","101","101","110"],
  E: ["111","100","110","100","111"], F: ["111","100","110","100","100"], G: ["011","100","101","101","011"], H: ["101","101","111","101","101"],
  I: ["111","010","010","010","111"], J: ["001","001","001","101","010"], K: ["101","101","110","101","101"], L: ["100","100","100","100","111"],
  M: ["101","111","111","101","101"], N: ["110","101","101","101","101"], O: ["111","101","101","101","111"], P: ["110","101","110","100","100"],
  Q: ["010","101","101","110","011"], R: ["110","101","110","101","101"], S: ["011","100","010","001","110"], T: ["111","010","010","010","010"],
  U: ["101","101","101","101","111"], V: ["101","101","101","101","010"], W: ["101","101","111","111","101"], X: ["101","101","010","101","101"],
  Y: ["101","101","010","010","010"], Z: ["111","001","010","100","111"],
};
function pixText(x, str, px, py) {
  for (const ch of str) { const g = FONT[ch]; if (g) g.forEach((row, j) => { for (let i = 0; i < 3; i++) if (row[i] === "1") x.fillRect(px + i, py + j, 1, 1); }); px += 4; }
}
function makeAtlas() {
  const L = atlasLayout(), [c, x] = canvasOf(L.w, L.h);
  for (const s of GOQ.SLOTS) { const p = L.pos[s.key]; x.drawImage(slotCanvas(s.key), p.x, p.y); }
  return c;
}
function makeGuide() {
  const L = atlasLayout(), [c, x] = canvasOf(L.w, L.h);
  for (const s of GOQ.SLOTS) {
    const p = L.pos[s.key], g = GOQ.sheetGrid(s);
    x.fillStyle = "rgba(0,200,255,.55)";
    for (let i = 1; i < g.cols; i++) x.fillRect(p.x + i * s.w, p.y, 1, p.h);
    for (let j = 1; j < g.rows; j++) x.fillRect(p.x, p.y + j * s.h, p.w, 1);
    x.fillStyle = "#ff00c8";
    x.fillRect(p.x - 1, p.y - 1, p.w + 2, 1); x.fillRect(p.x - 1, p.y + p.h, p.w + 2, 1);
    x.fillRect(p.x - 1, p.y - 1, 1, p.h + 2); x.fillRect(p.x + p.w, p.y - 1, 1, p.h + 2);
    pixText(x, s.key.toUpperCase().replace(/_/g, " "), p.x, p.y - BAND + 1);
  }
  return c;
}
function renderAtlas() {
  const main = $("#main"), ed = el("section", { class: "editor" }); main.appendChild(ed);
  const L = atlasLayout();
  ed.appendChild(el("h2", { class: "title", text: "Photoshop atlas" }));
  ed.appendChild(el("p", { class: "note", text: "Every sprite on one " + L.w + "×" + L.h + " sheet, so you can edit them all at once. The atlas includes any custom art you've already added." }));
  ed.appendChild(el("ol", { class: "steps" }, [
    "Download the atlas and the guide.",
    "Open the atlas in Photoshop. Add the guide as the top layer (File, then Place Embedded) and line it up at the top-left corner. Pink boxes mark each slot; blue lines split animation frames.",
    "Draw inside the pink boxes only. Leave pixels transparent where the game should show through (doors, frames, characters).",
    "Hide the guide, then save as PNG with transparency (File, then Export, then Export As). Don't crop or resize the canvas.",
    "Import the edited atlas here. Slots you changed become custom art; untouched slots keep the built-in art.",
  ].map(t => el("li", { text: t }))));
  const msg = el("p", { class: "msg", role: "status" });
  const input = el("input", { type: "file", accept: "image/png", class: "sr-only", id: "atlasFile" });
  input.addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try {
      const img = await loadImg(await readFile(f));
      if (img.width !== L.w) throw new Error("This atlas is " + img.width + " pixels wide; it should be " + L.w + ". Make sure the canvas wasn't resized or cropped.");
      const [full, fx] = canvasOf(img.width, img.height); fx.drawImage(img, 0, 0);
      let updated = 0, reset = 0, skipped = 0;
      for (const s of GOQ.SLOTS) {
        const p = L.pos[s.key];
        if (p.y + p.h > img.height) { skipped++; continue; } // an older, shorter atlas: newer slots aren't in it
        const [c, x] = canvasOf(p.w, p.h); x.drawImage(full, p.x, p.y, p.w, p.h, 0, 0, p.w, p.h);
        const px = dataOf(c);
        if (pixelsMatch(px, dataOf(slotCanvas(s.key)), 3)) continue;
        if (pixelsMatch(px, dataOf(GOQ.placeholder(s.key)), 3)) { delete draft.assets[s.key]; reset++; }
        else { draft.assets[s.key] = { src: c.toDataURL("image/png") }; updated++; }
      }
      changed({ now: true }); await game.setPack(packOut()); render();
      const m = $(".msg");
      m.className = "msg ok";
      m.textContent = updated || reset
        ? "Updated " + updated + " slot" + (updated === 1 ? "" : "s") + (reset ? ", set " + reset + " back to built-in art" : "") + (skipped ? ". " + skipped + " newer slot" + (skipped === 1 ? " wasn't" : "s weren't") + " in this atlas and stayed as they were" : "") + "."
        : "No changes found in that atlas.";
    } catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
  });
  ed.appendChild(el("div", { class: "row" }, [
    el("button", { class: "btn primary", type: "button", text: "Download atlas", onclick: () => makeAtlas().toBlob(b => download("museum-atlas.png", b)) }),
    el("button", { class: "btn", type: "button", text: "Download guide", onclick: () => makeGuide().toBlob(b => download("museum-atlas-guide.png", b)) }),
    el("label", { class: "btn", for: "atlasFile", text: "Import edited atlas" }), input,
  ]));
  ed.appendChild(msg);
  const view = el("div", { class: "atlas-view" }), scale = 2, a = makeAtlas(), g = makeGuide();
  [a, g].forEach(c => { c.style.width = c.width * scale + "px"; c.style.height = c.height * scale + "px"; view.appendChild(c); });
  const show = el("input", { type: "checkbox", checked: true });
  show.addEventListener("change", () => (g.hidden = !show.checked));
  ed.appendChild(el("label", { class: "check" }, [show, document.createTextNode("Show the guide")]));
  ed.appendChild(view);
}

/* ---------- Lighting ---------- */
function renderLighting() {
  const ed = el("section", { class: "editor" }); $("#main").appendChild(ed);
  ed.appendChild(el("h2", { class: "title", text: "Lighting" }));
  ed.appendChild(el("p", { class: "note", text: "How dark each room is with the lights on, and how strongly spotlights pick out the pieces. Turning the lights off at closing always goes nearly dark." }));
  for (const id in GOQ.ROOMS) {
    const L = draft.settings.lighting[id] || (draft.settings.lighting[id] = Object.assign({}, GOQ.ROOMS[id].light));
    const slider = (key, label, max, unit) => {
      const out = el("output", { text: Math.round(L[key] * 100) + "%" });
      const r = el("input", { type: "range", min: 0, max: max, step: 1, value: Math.round(L[key] * 100), "aria-label": GOQ.ROOMS[id].name + ": " + label });
      r.addEventListener("input", () => { L[key] = +r.value / 100; out.textContent = r.value + "%"; changed(); });
      return el("label", { class: "range" }, [el("span", { text: label }), r, out]);
    };
    ed.appendChild(el("fieldset", { class: "lightroom" }, [
      el("legend", { text: GOQ.ROOMS[id].name }),
      slider("dim", "Room dimness", 80), slider("spots", "Spotlights on pieces", 100),
      el("button", { class: "btn small quiet", type: "button", text: "Go there in the preview", onclick: () => { game.teleport(id); stage.focus({ preventScroll: true }); } }),
    ]));
  }
  ed.appendChild(el("div", { class: "row" }, [el("button", { class: "btn quiet", type: "button", text: "Back to the default lighting", onclick: () => {
    for (const id in GOQ.ROOMS) draft.settings.lighting[id] = Object.assign({}, GOQ.ROOMS[id].light); changed({ now: true }); render();
  } })]));
}

/* ---------- Staff ---------- */
function renderStaff() {
  const main = $("#main"); main.innerHTML = "";
  const st = draft.settings.staff || (draft.settings.staff = { eotm: { name: "", note: "" }, corkboard: GOQ.DEFAULT_CORKBOARD.slice() });
  const wrap = el("section", { class: "pieces" }); main.appendChild(wrap);
  wrap.appendChild(el("h2", { class: "title", text: "Staff" }));
